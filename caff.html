<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2FBF9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B2229" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<title>Cambridge Caffs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=JetBrains+Mono:wght@500;700&family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* Cambridge palette (University brand guidelines):
   Cambridge Blue #8EE8D8 · Light Blue #D1F9F1 · Warm Blue #00BDB6 · Dark Blue #133844.
   Dark blue text on Cambridge blue, never white. College colours are accents only. */
:root{
  --cam:#8EE8D8; --cam-light:#D1F9F1; --cam-warm:#00BDB6; --cam-dark:#133844;
  --bg:#F2FBF9; --bg-2:#E3F6F2;
  --surface:#FFFFFF; --surface-2:#F6FBFA;
  --ink:#133844; --ink-2:#44626B; --ink-3:#6B858C;
  --line:rgba(19,56,68,.12); --line-2:rgba(19,56,68,.2);
  --on-cam:#133844;
  --sel:var(--cam); --sel-ink:#133844;
  --shadow:0 1px 2px rgba(19,56,68,.06),0 6px 20px rgba(19,56,68,.08);
  --shadow-lg:0 2px 4px rgba(19,56,68,.06),0 16px 40px rgba(19,56,68,.14);
  --good:#0E7A55; --good-bg:rgba(14,122,85,.1);
  --warn-bg:#FFE3DC; --warn-ink:#7A1F0C;
  --display:'Fraunces',Georgia,serif;
  --ui:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.22,1,.36,1);
  --gut:16px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0B2229; --bg-2:#0F2C35;
    --surface:#133844; --surface-2:#174250;
    --ink:#E6FAF6; --ink-2:#AFD3CC; --ink-3:#86ABA5;
    --line:rgba(209,249,241,.12); --line-2:rgba(209,249,241,.22);
    --shadow:0 1px 2px rgba(0,0,0,.25),0 6px 20px rgba(0,0,0,.25);
    --shadow-lg:0 2px 4px rgba(0,0,0,.3),0 16px 40px rgba(0,0,0,.4);
    --good:#6FE0B6; --good-bg:rgba(111,224,182,.12);
    --warn-bg:#5A1F14; --warn-ink:#FFD2C6;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;min-height:100vh;font-family:var(--ui);color:var(--ink);font-size:15px;
  background:radial-gradient(120% 40% at 50% -8%, var(--cam-light) 0%, transparent 70%), var(--bg);
  padding:calc(env(safe-area-inset-top,0px) + 12px) var(--gut) calc(env(safe-area-inset-bottom,0px) + 32px)}
@media (prefers-color-scheme: dark){ body{background:radial-gradient(120% 40% at 50% -8%, #154552 0%, transparent 70%), var(--bg)} }
.wrap{max-width:1080px;margin:0 auto}
button,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--cam-warm);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.brand{display:flex;align-items:center;gap:9px;margin-right:auto;min-width:0}
.logo{width:34px;height:34px;border-radius:10px;background:var(--cam);display:grid;place-items:center;flex:0 0 auto;
  box-shadow:inset 0 0 0 1px rgba(19,56,68,.12)}
.logo svg{width:20px;height:20px}
.brand b{font-family:var(--display);font-size:1.25rem;font-weight:700;letter-spacing:-.01em;display:block;line-height:1.05}
.brand small{display:block;font-size:.7rem;color:var(--ink-3);font-weight:600}
.btn{border:1px solid var(--line-2);background:var(--surface);color:var(--ink);cursor:pointer;border-radius:999px;
  padding:7px 13px;font-size:.8rem;font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  transition:background .2s var(--ease),border-color .2s var(--ease),transform .15s var(--ease)}
.btn:hover{border-color:var(--cam-warm)}
.btn:active{transform:scale(.97)}
.btn.on{background:var(--cam);border-color:var(--cam);color:var(--on-cam)}
.btn svg{width:15px;height:15px;flex:0 0 auto}

/* ---------- college picker ---------- */
.pickhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 8px}
.pickhead .ttl{font-family:var(--mono);font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--ink-3);margin-right:auto}
.seg{display:inline-flex;background:var(--bg-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;cursor:pointer;border-radius:999px;padding:5px 12px;font-weight:700;font-size:.78rem;
  background:transparent;color:var(--ink-2);transition:background .2s var(--ease),color .2s var(--ease)}
.seg button[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink);box-shadow:0 1px 2px rgba(19,56,68,.15)}
.seg button:disabled{opacity:.4;cursor:default}
.seg[hidden]{display:none}
.rail{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;
  margin:0 calc(-1 * var(--gut)) 14px;padding:4px var(--gut) 8px}
.rail::-webkit-scrollbar{display:none}
.rail.all{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));overflow:visible;margin-left:0;margin-right:0;padding-left:0;padding-right:0}
@media(min-width:900px){ .rail{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));overflow:visible;margin-left:0;margin-right:0;padding-left:0;padding-right:0}
  #allBtn{display:none} }
.chip{flex:0 0 auto;scroll-snap-align:start;display:flex;align-items:center;gap:9px;min-width:176px;text-align:left;
  border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:7px 10px 7px 8px;cursor:pointer;
  box-shadow:var(--shadow);position:relative;overflow:hidden;
  transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s var(--ease)}
.chip::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.chip:hover{transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.chip[aria-selected="true"]{border-color:var(--cam-warm);box-shadow:0 0 0 2px var(--cam-warm),var(--shadow-lg);
  background:linear-gradient(0deg, color-mix(in srgb, var(--cam) 14%, var(--surface)), var(--surface))}
.chip img{width:28px;height:34px;object-fit:contain;flex:0 0 auto;filter:drop-shadow(0 1px 1px rgba(0,0,0,.15))}
.chip .t{min-width:0;flex:1}
.go{flex:0 0 auto;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;text-decoration:none;
  background:var(--bg-2);color:var(--ink);border:1px solid var(--line);transition:background .2s var(--ease),transform .15s var(--ease)}
.go:hover{background:var(--cam);border-color:var(--cam);color:var(--on-cam)}
.go:active{transform:scale(.92)}
.go svg{width:15px;height:15px}
a.fact.take{background:var(--cam-dark);color:#fff}
a.fact.take:hover{box-shadow:none;background:#0d2a33}
@media (prefers-color-scheme: dark){ a.fact.take{background:var(--cam);color:var(--cam-dark)} }
.tog.meat[aria-pressed="true"]{background:#F6D3C4;color:#6E2A10;border-color:#F6D3C4}
@media (prefers-color-scheme: dark){ .tog.meat[aria-pressed="true"]{background:#6E2A10;color:#FFE1D4;border-color:#6E2A10} }
.chip .kind{font-family:var(--mono);font-size:.54rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-left:4px}
.chip .n{display:block;font-weight:800;font-size:.86rem;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .m{display:block;font-size:.68rem;color:var(--ink-3);font-weight:600;white-space:nowrap}
.chip .m.near{color:var(--good)}
.chip.far{opacity:.45}
.chip.empty .n{color:var(--ink-3)}

/* ---------- location panel ---------- */
.locbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-4px 0 12px;padding:9px 12px;border-radius:14px;
  background:var(--surface-2);border:1px solid var(--line);font-size:.8rem;color:var(--ink-2)}
.locbar[hidden]{display:none}
.locbar select{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:4px 6px;font-size:.8rem}
.locbar .x{margin-left:auto}

/* ---------- college hero ---------- */
.hero{position:relative;display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);
  border-radius:20px;padding:14px 16px;box-shadow:var(--shadow);margin:0 0 12px;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--c)}
.hero::before{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle, color-mix(in srgb, var(--c) 16%, transparent), transparent 70%)}
.hero .crest{width:56px;height:68px;object-fit:contain;flex:0 0 auto;filter:drop-shadow(0 2px 3px rgba(0,0,0,.18));position:relative}
.hero .info{min-width:0;flex:1;position:relative}
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(1.35rem,4.8vw,1.9rem);line-height:1.08;margin:0 0 5px;letter-spacing:-.01em}
.facts{display:flex;flex-wrap:wrap;gap:5px 6px;align-items:center}
.fact{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:999px;
  background:var(--bg-2);color:var(--ink-2);text-decoration:none;white-space:nowrap}
.fact svg{width:13px;height:13px}
.fact.dist{background:var(--cam);color:var(--on-cam)}
.fact.near{background:var(--good-bg);color:var(--good)}
a.fact:hover{box-shadow:inset 0 0 0 1px var(--cam-warm)}
.nav{display:flex;flex-direction:column;gap:6px;position:relative}
.nav button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;
  display:grid;place-items:center;color:var(--ink-2)}
.nav button:hover{border-color:var(--cam-warm);color:var(--ink)}
.nav svg{width:16px;height:16px}
@media(max-width:420px){ .nav{display:none} }

/* ---------- controls ---------- */
.controls{position:sticky;top:0;z-index:5;margin:0 calc(-1 * var(--gut)) 12px;padding:8px var(--gut);display:grid;gap:8px;
  background:color-mix(in srgb, var(--bg) 88%, transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line)}
.days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;border:1px solid var(--line);cursor:pointer;border-radius:12px;padding:4px 10px 5px;min-width:50px;
  background:var(--surface);color:var(--ink-2);text-align:center;transition:.2s var(--ease)}
.day:hover{border-color:var(--cam-warm)}
.day .dw{display:block;font-family:var(--mono);font-size:.56rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.day .dn{display:block;font-family:var(--display);font-size:1.1rem;line-height:1.1;font-weight:700;color:var(--ink)}
.day[aria-pressed="true"]{background:var(--cam-dark);border-color:var(--cam-dark);color:var(--cam)}
.day[aria-pressed="true"] .dn{color:#fff}
@media (prefers-color-scheme: dark){ .day[aria-pressed="true"]{background:var(--cam);border-color:var(--cam);color:var(--cam-dark)} .day[aria-pressed="true"] .dn{color:var(--cam-dark)} }
.row{display:flex;gap:6px 8px;align-items:center;flex-wrap:wrap}
.hours{font-family:var(--mono);font-size:.7rem;font-weight:700;color:var(--ink-3)}
.row .btn{margin-left:auto}

/* ---------- preferences ---------- */
.prefs{display:grid;gap:8px;margin:0 0 12px;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.prefs[hidden]{display:none}
.lbl{font-family:var(--mono);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--ink-3);min-width:62px}
.tog{border:1px solid var(--line-2);cursor:pointer;border-radius:999px;padding:4px 11px;font-size:.76rem;font-weight:700;
  background:transparent;color:var(--ink-2);transition:.2s var(--ease);white-space:nowrap}
.tog:hover{border-color:var(--cam-warm)}
.tog[aria-pressed="true"]{background:var(--cam);color:var(--on-cam);border-color:var(--cam)}
.tog.avoid[aria-pressed="true"]{background:var(--warn-bg);color:var(--warn-ink);border-color:var(--warn-bg)}
.tog.avoid[aria-pressed="true"]::before{content:"no ";font-weight:600}
.switch{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:.78rem;font-weight:700;color:var(--ink-2);border:0;background:none;padding:2px 0}
.switch i{width:30px;height:18px;border-radius:999px;background:var(--line-2);position:relative;transition:.2s var(--ease)}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.2s var(--ease);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch[aria-pressed="true"] i{background:var(--cam-warm)}
.switch[aria-pressed="true"] i::after{transform:translateX(12px)}
.summary{font-size:.78rem;font-weight:600;color:var(--ink-2);margin:0 0 10px}
.summary b{color:var(--good)}

/* ---------- menu ---------- */
.stage{overflow:hidden;margin:0 -10px;padding:2px 10px}
.menu{columns:1;column-gap:12px}
@media(min-width:640px){.menu{columns:2}}
@media(min-width:980px){.menu{columns:3}}
.menu.in-left{animation:inL .35s var(--ease)}
.menu.in-right{animation:inR .35s var(--ease)}
@keyframes inL{from{opacity:0;transform:translateX(-30px)}}
@keyframes inR{from{opacity:0;transform:translateX(30px)}}
@media(prefers-reduced-motion:reduce){.menu.in-left,.menu.in-right{animation:none}}

.card{break-inside:avoid;display:inline-block;width:100%;margin:0 0 12px;background:var(--surface);color:var(--ink);
  border:1px solid var(--line);border-radius:16px;padding:12px 15px 8px;box-shadow:var(--shadow)}
.card.wide{column-span:all;display:block}
.card.wide ul{columns:1;column-gap:26px}
@media(min-width:640px){.card.wide ul{columns:2}}
@media(min-width:980px){.card.wide ul{columns:3}}
.card.wide .dish{break-inside:avoid}
.card h2{display:flex;align-items:center;gap:7px;margin:0 0 4px;font-family:var(--mono);font-size:.62rem;letter-spacing:.16em;
  text-transform:uppercase;font-weight:700;color:var(--ink-2)}
.card h2::before{content:"";width:8px;height:8px;border-radius:3px;background:var(--k,var(--cam-warm));flex:0 0 auto}
.card h2 .cnt{margin-left:auto;letter-spacing:.04em;color:var(--good)}
.card ul{list-style:none;margin:0;padding:0}
.dish{padding:7px 0 8px;border-top:1px solid var(--line);transition:opacity .2s}
.card:not(.wide) .dish:first-child{border-top:0}
.card.wide .dish{border-top:0;border-bottom:1px solid var(--line)}
.line{display:flex;align-items:baseline;gap:6px}
.name{font-weight:700;font-size:.92rem;line-height:1.32}
.lead{flex:1 1 10px;min-width:10px;border-bottom:1.5px dotted var(--line-2);transform:translateY(-4px)}
.price{font-family:var(--mono);font-weight:700;font-size:.76rem;color:var(--ink-2);white-space:nowrap}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:3px 4px;margin-top:3px}
.tag{font-family:var(--mono);font-size:.58rem;font-weight:700;letter-spacing:.03em;padding:1px 6px;border-radius:999px;
  background:var(--bg-2);color:var(--ink-2)}
.tag.vegan,.tag.vegetarian{background:rgba(22,160,110,.14);color:#0B7250}
.tag.halal,.tag.halal-option{background:rgba(40,120,210,.13);color:#1D5A9E}
.tag.gluten-free,.tag.gf-option{background:rgba(214,150,30,.18);color:#855304}
.tag.pescatarian{background:rgba(0,189,182,.15);color:#036F6B}
.tag.co2,.tag.kcal{background:none;border:1px solid var(--line-2)}
.tag.wf-df{background:rgba(214,150,30,.12);color:#855304}
.desc{display:block;font-size:.72rem;color:var(--ink-3);font-weight:500;margin-top:1px;line-height:1.35}
@media (prefers-color-scheme: dark){
  .tag.vegan,.tag.vegetarian{color:#7BE3BC}.tag.halal,.tag.halal-option{color:#9CC6F5}
  .tag.gluten-free,.tag.gf-option{color:#F2C878}.tag.pescatarian{color:#8EE8D8}
}
.allergens{font-size:.66rem;color:var(--ink-3);font-weight:500}
.allergens mark{background:var(--warn-bg);color:var(--warn-ink);border-radius:3px;padding:0 3px}
.hdot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;align-self:center;background:#bbb;display:inline-block}
.hdot.green{background:#2FA66B}.hdot.amber{background:#E2A93C}.hdot.red{background:#D23C3C}
.dish.hit .name::after{content:" ✓";color:var(--good)}
.dish.miss{opacity:.35}
.dish.unknown{opacity:.7}
.hide-miss .dish:not(.hit){display:none}
.hide-miss .card.nohit{display:none}

.note{column-span:all;display:flex;align-items:flex-start;gap:9px;margin:0 0 12px;padding:10px 14px;border-radius:14px;
  background:var(--cam);color:var(--on-cam);font-weight:700;font-size:.84rem}
.note::before{content:"★"}
.note.info{background:var(--surface-2);color:var(--ink-2);font-weight:600;border:1px solid var(--line)}
.note.info::before{content:"i";font-family:var(--mono);font-weight:700;width:18px;height:18px;border-radius:50%;flex:0 0 auto;
  display:grid;place-items:center;background:var(--bg-2);color:var(--ink-2);font-size:.7rem}

/* course colours: just the small square in the heading */
.k-veg{--k:#2FB57F}.k-soup{--k:#E2A93C}.k-main{--k:#D0453F}.k-carb{--k:#4B92D9}.k-side{--k:#7FCBA6}
.k-salad{--k:#8DC45F}.k-sweet{--k:#A57FE0}.k-deli{--k:#EE8A5F}.k-other{--k:#9DB2B6}

.notice{column-span:all;background:var(--surface);border:1px dashed var(--line-2);border-radius:18px;padding:28px 20px;text-align:center;color:var(--ink-2)}
.notice h2{font-family:var(--display);font-weight:700;font-size:1.25rem;margin:0 0 4px;color:var(--ink)}
.notice p{margin:0;font-size:.86rem}
.notice a{color:var(--ink);font-weight:700}

footer{margin-top:18px;font-size:.72rem;color:var(--ink-3);line-height:1.6;display:grid;gap:8px}
footer .key{display:flex;flex-wrap:wrap;gap:3px 12px;align-items:center}
footer .key span{display:inline-flex;align-items:center;gap:5px}
footer a{color:var(--ink-2);font-weight:700}
footer details summary{cursor:pointer;font-weight:700;color:var(--ink-2)}
footer details ul{margin:6px 0 0;padding-left:18px}
</style>
</head>
<body>
<div class="wrap" id="wrap" hidden>

  <div class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#133844" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v8a2 2 0 0 0 2 2v8M5 3v5M9 3v5M17 21V3c-2 1.5-3 4-3 7s1 3 3 3"/></svg>
      </span>
      <span><b>Cambridge Caffs</b><small>College cafeteria menus, in one place</small></span>
    </div>
    <button class="btn" id="locBtn" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7"/></svg>
      <span>Near me</span>
    </button>
  </div>

  <div class="locbar" id="locbar" hidden></div>

  <div class="pickhead">
    <span class="ttl" id="pickTitle">Colleges &amp; cafés</span>
    <div class="seg" role="group" aria-label="Order colleges">
      <button data-order="az" aria-pressed="true">A–Z</button>
      <button data-order="near" aria-pressed="false">Nearest</button>
    </div>
    <div class="seg" id="reach" role="group" aria-label="Walking distance" hidden>
      <button data-reach="0" aria-pressed="true">Any</button>
      <button data-reach="10" aria-pressed="false">≤10 min</button>
      <button data-reach="20" aria-pressed="false">≤20 min</button>
    </div>
    <button class="btn" id="allBtn" aria-expanded="false">All</button>
  </div>
  <nav class="rail" id="rail" role="tablist" aria-label="College"></nav>

  <section class="hero" id="hero"></section>

  <div class="controls">
    <div class="days" id="days" role="group" aria-label="Day"></div>
    <div class="row">
      <div class="seg" id="seg" role="group" aria-label="Sitting"></div>
      <span class="hours" id="hours"></span>
      <button class="btn" id="sortBtn" aria-expanded="false" aria-controls="prefPanel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>

}

/* ---------- distance ---------- */
function metres(a, b){
  const R = 6371000, r = Math.PI / 180;
  const dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
/* Streets aren't straight: 1.3× the crow-flies distance, walking 80 m/min, cycling 250 m/min. */
function trip(id){
  if (!origin || !INFO[id]) return null;
  const m = metres(origin, INFO[id]), route = m * 1.3;
  return { m, walk: Math.max(1, Math.round(route / 80)), bike: Math.max(1, Math.round(route / 250)) };
}
/* Opens Google Maps turn-by-turn walking directions to the college. Only the college's coordinates go in the link. */

}

/* ---------- dietary judging ---------- */
function coverage(c){
  let diet = false, allergens = false, gf = false;
  (c.days || []).forEach(d => SITTINGS.forEach(k => (d[k] || []).forEach(co => co.dishes.forEach(x => {
    if (has(x.diet)) diet = true;
    if (has(x.allergens) || x.noAllergens) allergens = true;
    if ((x.diet || []).some(t => t === "gluten-free" || t === "gf-option")) gf = true;
  }))));
  return { diet, allergens, gf, full: c.marks === "full" };
}
/* A dish is a match only when every chosen preference is confirmed.
   One failed preference makes it a miss; anything unconfirmed leaves it unknown. */
function judge(x, cov){
  if (!diets.size && !avoids.size) return null;
  const diet = x.diet || [], all = (x.allergens || []).join(", ");
  let unsure = false;
  for (const p of diets){
    if (p === "meat"){ if (!isMeat(x)) return "miss"; continue; }
    /* Where a college only marks some dishes, an unmarked dish is unknown, not "no". */
    if (!cov.diet || (!cov.full && !diet.length)){ unsure = true; continue; }
    if (!DIET_OK[p].some(k => diet.includes(k))) return "miss";
  }
  for (const a of avoids){
    if (a === "gluten" && (diet.includes("gluten-free") || diet.includes("gf-option"))) continue;
    if (a === "gluten" && !cov.allergens && cov.gf && cov.full) return "miss";
    /* No allergens listed is treated as unknown, never as safe. */
    if (!cov.allergens || (!has(x.allergens) && !x.noAllergens)){ unsure = true; continue; }
    if (ALLERGEN[a].test(all)) return "miss";
  }
  return unsure ? null : "hit";
}
const rank = v => v === "hit" ? 0 : v === "miss" ? 2 : 1;

  }

  $("days").innerHTML = days.map((x, i) => {
    const t = new Date(x.date + "T12:00:00");
    return '<button class="day" data-date="' + x.date + '" aria-pressed="' + (i === di) + '">' +

      '<span class="dn">' + t.getDate() + "</span></button>";
  }).join("");

  const sits = sittingsOf(d);
  let s = sit && sits.includes(sit) ? sit : null;
  if (!s){
    const h = new Date().getHours() + new Date().getMinutes() / 60;
    const want = h < 10.5 ? "breakfast" : h < 15 ? "lunch" : "dinner";
    s = SITTINGS.slice(SITTINGS.indexOf(want)).concat(SITTINGS).find(k => sits.includes(k)) || sits[0];
  }
  $("seg").innerHTML = sits.map(k =>
    '<button data-sit="' + k + '" aria-pressed="' + (k === s) + '">' + esc((d.labels && d.labels[k]) || SIT_LABEL[k]) + "</button>").join("");
  $("hours").textContent = (d.hours && d.hours[s]) || "";

  const cov = coverage(c);
  const sorting = nPrefs > 0;
  let total = 0, hits = 0;
  const courses = (d[s] || []).map((course, idx) => {
    const dishes = course.dishes.map((x, j) => ({ x, j, v: judge(x, cov) }));
    if (sorting) dishes.sort((a, b) => rank(a.v) - rank(b.v) || a.j - b.j);

  });
  if (sorting) courses.sort((a, b) => (b.n > 0) - (a.n > 0) || a.idx - b.idx);
  const judged = courses.some(x => x.dishes.some(y => y.v));
  const hiding = onlyHits && sorting && judged;
  if (hiding) menu.classList.add("hide-miss");

  const notes = ((d.notes && d.notes[s]) || []).map(n => '<div class="note">' + esc(n) + "</div>");
  if (c.note) notes.push('<div class="note info">' + esc(c.note) + "</div>");
  if (sorting){
    const gaps = [];
    const markDiets = [...diets].filter(p => p !== "meat");
    if (markDiets.length && !cov.diet) gaps.push("dietary marks");
    if ([...avoids].some(a => a !== "gluten") && !cov.allergens) gaps.push("allergens");
    else if (avoids.has("gluten") && !cov.allergens && !cov.gf) gaps.push("gluten information");
    if (diets.has("meat")) notes.push('<div class="note info">“Meat” is worked out from dish names, so check the counter if it matters.</div>');
    if (markDiets.length && cov.diet && !cov.full) notes.push('<div class="note info">' + esc(c.name) +
      " only marks some dishes, so unmarked ones are listed after the matches rather than ruled out.</div>");
    if (gaps.length) notes.push('<div class="note info">' + esc(c.name) + " doesn’t publish " + gaps.join(" or ") +
      ", so those preferences can’t be checked here.</div>");
  }

  const summary = $("summary");
  if (sorting){
    const what = [...diets].map(cap).concat([...avoids].map(a => a === "gluten" ? "Gluten-free" : "no " + a));
    summary.hidden = false;
    summary.innerHTML = "For " + esc(what.join(" · ")) + ": <b>" + hits + " of " + total + "</b> dishes match" +
      (hiding ? " · showing matches only" : "");
  } else summary.hidden = true;

  menu.innerHTML = notes.join("") + courses.map(({ course, dishes, n }) => {
    const items = dishes.map(({ x, v }) => {
      const diet = x.diet || [];
      const tags = diet.map(k => '<span class="tag ' + esc(k) + '" title="' + esc(TITLE[k] || cap(k)) + '">' + esc(LABEL[k] || k) + "</span>").join("") +
        (x.carbon ? '<span class="tag co2" title="Carbon rating">CO₂ ' + esc(x.carbon) + "</span>" : "") +
        (x.kcal ? '<span class="tag kcal" title="Calories">' + esc(x.kcal) + " kcal</span>" : "");
      const all = (x.allergens || []).map(a => {
        const bad = [...avoids].some(k => ALLERGEN[k].test(a));
        return bad ? "<mark>" + esc(a.toLowerCase()) + "</mark>" : esc(a.toLowerCase());
      }).join(", ");
      return '<li class="dish' + (v ? " " + v : sorting ? " unknown" : "") + '">' +
        '<div class="line">' + (x.health ? '<i class="hdot ' + esc(x.health) + '" title="' + esc(x.health) + '"></i>' : "") +
          '<span class="name">' + esc(x.name) + "</span>" +
          (x.price ? '<span class="lead"></span><span class="price">' + esc(x.price) + "</span>" : "") + "</div>" +
        (x.desc ? '<span class="desc">' + esc(x.desc) + "</span>" : "") +
        (tags || all || x.noAllergens ? '<div class="meta">' + tags + (all ? '<span class="allergens">Contains ' + all + "</span>"
          : x.noAllergens ? '<span class="allergens">No listed allergens</span>' : "") + "</div>" : "") +
        "</li>";
    }).join("");
    const untitled = !course.name;
    const cls = "card" + (untitled ? " wide" : " k-" + kind(course.name)) + (!n ? " nohit" : "");
    const head = untitled && !sorting ? "" :
      "<h2><span>" + esc(course.name || SIT_LABEL[s]) + "</span>" +
      (sorting && dishes.some(y => y.v) ? '<span class="cnt">' + n + " match" + (n === 1 ? "" : "es") + "</span>" : "") + "</h2>";
    return '<section class="' + cls + '">' + head + "<ul>" + items + "</ul></section>";
  }).join("") +
    (hiding && !hits ? '<div class="notice"><h2>Nothing matches</h2><p>No dish in this sitting fits your choices. ' +
      "Try another day, sitting or college, or turn off “Only show matches”.</p></div>" : "");
}

function renderHero(c){
  const i = INFO[c.id] || {}, t = trip(c.id);
  const dir = i.lat ? navUrl(c.id) : "";
  const dayTxt = date ? new Date(date + "T12:00:00").toLocaleDateString("en-GB", { weekday:"long", day:"numeric", month:"long" }) : "";
  $("hero").style.setProperty("--c", i.c || "#888");
  $("hero").innerHTML =
    (CRESTS[c.id] ? '<img class="crest" src="' + CRESTS[c.id] + '" alt="' + esc(c.full) + ' crest">' : "") +
    '<div class="info"><h1>' + esc(c.full) + "</h1>" +
      '<div class="facts">' +
        (t ? '<span class="fact dist">' + ICON.pin + fmtDist(t.m) + "</span>" +
             '<span class="fact' + (t.walk <= 10 ? " near" : "") + '">' + ICON.walk + t.walk + " min</span>" +
             '<span class="fact">' + ICON.bike + t.bike + " min</span>" : "") +
        (dir ? '<a class="fact take" href="' + dir + '" target="_blank" rel="noopener">' + ICON.nav + "Take me there</a>" : "") +
        '<a class="fact" href="' + esc(c.url) + '" target="_blank" rel="noopener">' + ICON.ext + "Source</a>" +
        (c.at ? '<span class="fact">Updated ' + esc(ago(c.at)) + "</span>" : "") +
      "</div></div>" +
    '<div class="nav"><button data-step="-1" aria-label="Previous college">' + ICON.prev + "</button>" +
      '<button data-step="1" aria-label="Next college">' + ICON.next + "</button></div>";
}

/* ---------- input ---------- */
const toggle = (set, v) => set.has(v) ? set.delete(v) : set.add(v);
document.addEventListener("click", e => {
  if (!DATA || e.target.closest("a")) return;
  const chip = e.target.closest(".chip[data-college]");
  if (chip){ selectCollege(chip.dataset.college); return; }
  const t = e.target.closest("button");
  if (!t) return;
  const ds = t.dataset;
  if (ds.college) selectCollege(ds.college);
  else if (ds.step) step(+ds.step);
  else if (ds.date){ date = ds.date; render(); }
  else if (ds.sit){ sit = ds.sit; render(); }
  else if (ds.diet){
    toggle(diets, ds.diet);
    if (ds.diet === "meat" && diets.has("meat")) ["vegan", "vegetarian", "pescatarian"].forEach(k => diets.delete(k));
    else if (ds.diet !== "halal" && diets.has(ds.diet)) diets.delete("meat");
    store.set("diets", [...diets]); render();
  }
  else if (ds.avoid){ toggle(avoids, ds.avoid); store.set("avoids", [...avoids]); render(); }
  else if (ds.order){
    if (ds.order === "near" && !origin){ locate(); return; }
    order = ds.order; store.set("order", order); render();
  }
  else if (ds.reach != null){ reach = +ds.reach; render(); }
  else if (t.id === "onlyHits"){ onlyHits = !onlyHits; store.set("onlyHits", onlyHits); render(); }
  else if (t.id === "clearPrefs"){ diets.clear(); avoids.clear(); store.set("diets", []); store.set("avoids", []); render(); }
  else if (t.id === "sortBtn"){ const open = $("prefPanel").hidden; $("prefPanel").hidden = !open; t.setAttribute("aria-expanded", open); }
  else if (t.id === "allBtn"){ railOpen = !railOpen; renderRail(); }
  else if (t.id === "locBtn"){ origin && origin.label === "your location" ? locOff() : locate(); }
  else if (t.id === "locOff") locOff();
  else if (t.id === "usePick") showPicker("");
});
document.addEventListener("change", e => {
  if (e.target.id !== "fromSel" || !e.target.value) return;
  const c = DATA.colleges.find(x => x.id === e.target.value);
  origin = { lat: INFO[c.id].lat, lng: INFO[c.id].lng, label: c.name };
  afterLocate(false);
});
document.addEventListener("keydown", e => {
  if (!DATA || /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  if ((e.key === "Enter" || e.key === " ") && e.target.matches(".chip[data-college]")){ e.preventDefault(); selectCollege(e.target.dataset.college); return; }
  if (e.key === "ArrowRight") step(1);
  if (e.key === "ArrowLeft") step(-1);
});
/* Swipe the menu sideways to move between colleges. */
let sx = null, sy = null;
$("menu").addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive:true });
$("menu").addEventListener("touchend", e => {
  if (sx == null || !DATA) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) step(dx < 0 ? 1 : -1);
  sx = null;
}, { passive:true });
window.addEventListener("hashchange", () => {
  const id = location.hash.slice(1);
  if (DATA && DATA.colleges.some(c => c.id === id)) selectCollege(id);
});

/* ---------- data ---------- */
function fail(err){
  if (DATA) return;               /* a failed background refresh keeps what is on screen */
  $("wrap").hidden = false;
  $("menu").innerHTML = '<div class="notice"><h2>Couldn’t reach the menus</h2><p>' + esc(err && err.message || err) + ".</p></div>";
}
/* Last good reply, kept on this device so a repeat visit draws instantly. */
function cached(){ try { const v = JSON.parse(localStorage.getItem("caffs.data") || "null"); return v && Array.isArray(v.colleges) ? v : null; } catch(e){ return null; } }
function keep(d){ try { localStorage.setItem("caffs.data", JSON.stringify(d)); } catch(e){} }

function applyData(d, fresh){
  if (!d || !Array.isArray(d.colleges) || !d.colleges.length) return fail(new Error("Empty reply"));
  if (fresh) keep(d);
  const first = !DATA;
  const same = !first && JSON.stringify(d.colleges.map(c => c.days)) === JSON.stringify(DATA.colleges.map(c => c.days));
  DATA = d;
  if (first){
    const want = location.hash.slice(1) || store.get("college", "");
    curId = DATA.colleges.some(c => c.id === want) ? want : DATA.colleges[0].id;
    $("credits").innerHTML = CREDITS.map(k => '<li>' + esc(k.college) + ': <a href="' + esc(k.page) + '" target="_blank" rel="noopener">' +
      esc(k.file) + "</a> — " + esc(k.lic) + (k.artist ? ", " + esc(k.artist) : "") + "</li>").join("");
    /* Re-use location only if the browser already allows it — never prompt on load. */
    if (store.get("useLoc", false) && navigator.permissions && navigator.geolocation){
      navigator.permissions.query({ name: "geolocation" }).then(p => { if (p.state === "granted") locate(false); }).catch(() => {});
    }
  }
  if (same && date){ renderHero(college()); return; }   /* nothing new: no redraw */
  render();
}
function load(){
  if (window.google && google.script && google.script.run){
    google.script.run.withSuccessHandler(d => applyData(d, true)).withFailureHandler(fail).getMenus();
  } else if (API_URL){
    const url = API_URL + (API_URL.includes("?") ? "&" : "?") + "json";
    fetch(url).then(r => { if (!r.ok) throw new Error("Server said " + r.status); return r.json(); })
      .then(d => applyData(d, true)).catch(fail);
  } else if (!DATA){
    fail(new Error("No API_URL set in this page"));
  }
}
/* First paint: the menus that came with the page, else this device's last copy.
   Then fetch fresh in the background, unless the page itself was just built by the server. */
(function start(){
  const now = BOOT || window.CAFF_DATA || cached();
  if (now) applyData(now, false);
  if (!BOOT && !window.CAFF_DATA) (window.requestIdleCallback || setTimeout)(load);
})();
/* The server re-reads every college every 30 minutes on its own. The page just
   picks up the newest saved copy: every 10 minutes and whenever the tab comes back. */
setInterval(() => { if (!document.hidden) load(); }, 10 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
setInterval(() => { if (date && date < todayISO()){ date = null; load(); } }, 60 * 1000);
</script>

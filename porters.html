<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8E0F14">
<title>The Lodge &middot; Jesus College MCR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Manrope:wght@400..800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   THE LODGE.
   Read by somebody standing at a counter with a person waiting in
   front of them, often on an old screen in a bright room. So: one
   search box that always has the cursor, one answer the size of a
   fist, and enough contrast to be read at arm's length.
   ============================================================ */
:root{
  /* The MCR Book's palette, so the Lodge reads as the same building. */
  --crimson:#B4141B; --crimson-2:#A31319; --crimson-3:#7A0D12; --crimson-4:#48050A;
  --cream:#FBF3EC; --cream-2:#F2E4D8; --cream-3:#E2CDBC; --cream-4:#A78C77;
  --paper:#FFFDFA; --ink:#2A0F0C; --ink-soft:#6E4F4A; --gold:#EBB753; --gold-2:#FCE7B6; --gold-ink:#3A2700;
  --green:#1E6B47; --green-2:#D7F0E2;
  --t1:rgba(0,0,0,.24); --t2:rgba(255,255,255,.07); --t3:rgba(0,0,0,.36); --line:rgba(255,255,255,.14);
  --edge-2:rgba(255,255,255,.20);
  --display:'Fraunces',Georgia,serif; --body:'Manrope',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  --r:18px; --r2:14px; --ease:cubic-bezier(.22,.9,.3,1);
  --sab:env(safe-area-inset-bottom,0px); --sat:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0}
html{font-size:106%}
@media(min-width:1000px){html{font-size:112%}}
body{min-height:100dvh;color:var(--cream);font-family:var(--body);font-weight:500;line-height:1.5;
  background:
    radial-gradient(680px 600px at 2% 104%, rgba(72,5,10,.72), transparent 62%),
    linear-gradient(172deg,#C4181F 0%,#A31319 46%,#7A0D12 100%);
  background-attachment:fixed;-webkit-font-smoothing:antialiased}
.wrap{max-width:900px;margin:0 auto;padding:calc(14px + var(--sat)) 16px calc(30px + var(--sab))}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
[hidden]{display:none!important}

header{display:flex;align-items:center;gap:11px;margin-bottom:14px;flex-wrap:wrap}
.beta{font-family:var(--mono);font-size:.56rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700;
  color:var(--gold-ink);background:var(--gold);border-radius:6px;padding:3px 7px;display:inline-block;
  vertical-align:middle;margin-left:7px;line-height:1.3}
.crest{width:2.1rem;height:2.1rem;flex:0 0 2.1rem;object-fit:contain}
.wm b{display:block;font-family:var(--display);font-size:1.08rem;font-weight:600;letter-spacing:-.035em;line-height:1}
.wm b i{font-style:italic;color:var(--gold-2);font-weight:400}
.wm small{display:block;font-family:var(--mono);font-size:.58rem;color:var(--gold-2);letter-spacing:.2em;
  text-transform:uppercase;font-weight:600;margin-top:4px}
header .right{margin-left:auto;display:flex;gap:7px;align-items:center}
.iconbtn{width:2rem;height:2rem;border-radius:50%;background:var(--t1);display:grid;place-items:center;color:var(--cream-2);
  border:0;cursor:pointer;transition:.18s}
.iconbtn:hover{background:var(--t2);color:var(--cream)}
.iconbtn svg{width:1rem;height:1rem;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ---------- the search, which is the whole screen ---------- */
.hunt{position:relative;margin-bottom:12px}
.hunt input{width:100%;background:var(--paper);border:0;border-radius:16px;padding:19px 52px 19px 20px;
  font-family:var(--body);font-size:1.22rem;font-weight:700;color:var(--ink);outline:0;letter-spacing:-.02em}
.hunt input::placeholder{color:var(--cream-3);font-weight:600}
.hunt input:focus{box-shadow:0 0 0 3px var(--gold)}
.hunt .x{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;
  border:0;background:var(--cream-2);color:var(--ink-soft);cursor:pointer;font-size:1rem;line-height:1}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;border:0;cursor:pointer;font:inherit;font-size:.78rem;font-weight:800;padding:10px 8px;border-radius:999px;
  background:var(--t1);color:var(--cream-3);transition:.16s}
.tabs button[aria-current="true"]{background:var(--gold);color:var(--gold-ink)}
.tabs button b{font-family:var(--mono);font-weight:700;opacity:.75;margin-left:5px}

/* ---------- the answer ---------- */
.answer{border-radius:var(--r);padding:20px;margin-bottom:12px;animation:rise .2s var(--ease) both}
.answer.yes{background:var(--green-2);color:#123D28}
.answer.no{background:var(--paper);color:var(--ink)}
.answer .verdict{display:flex;align-items:center;gap:12px}
.answer .mark{width:44px;height:44px;flex:0 0 44px;border-radius:50%;display:grid;place-items:center;font-size:1.4rem;font-weight:800}
.answer.yes .mark{background:var(--green);color:#fff}
.answer.no .mark{background:var(--crimson);color:#fff}
.answer .verdict b{font-family:var(--display);font-size:1.5rem;font-weight:600;letter-spacing:-.04em;line-height:1.05}
.answer .who{margin-top:12px;font-size:1.05rem;font-weight:800;letter-spacing:-.02em}
.answer .det{font-family:var(--mono);font-size:.72rem;margin-top:5px;opacity:.78;word-break:break-all}
.answer .tag{display:inline-block;font-family:var(--mono);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;
  font-weight:700;padding:5px 10px;border-radius:999px;margin-top:10px}
.answer.yes .tag{background:rgba(30,107,71,.16);color:#123D28}
.answer.no .tag{background:rgba(180,20,27,.12);color:var(--crimson-3)}

/* ---------- the lists ---------- */
.rows{background:var(--t1);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 15px;box-shadow:0 1px 0 rgba(255,255,255,.06);cursor:pointer;
  transition:background .12s}
.row:last-child{box-shadow:none}
.row:hover,.row:focus-visible{background:var(--t2);outline:0}
.row .av{width:32px;height:32px;flex:0 0 32px;border-radius:50%;background:var(--t2);display:grid;place-items:center;
  font-family:var(--display);font-size:.72rem;font-weight:600;color:var(--gold-2)}
.row.v .av{background:rgba(235,183,83,.22)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:.92rem;font-weight:700;letter-spacing:-.015em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t span{display:block;font-family:var(--mono);font-size:.66rem;color:var(--cream-3);margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .pin{font-family:var(--mono);font-size:.56rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;
  padding:4px 8px;border-radius:999px;background:var(--t2);color:var(--cream-3);flex:none}
.row.v .pin{background:rgba(235,183,83,.2);color:var(--gold-2)}
.letter{font-family:var(--mono);font-size:.62rem;letter-spacing:.18em;color:var(--gold-2);font-weight:700;
  padding:12px 15px 6px;background:rgba(0,0,0,.16)}
.note{font-size:.78rem;color:var(--cream-3);text-align:center;padding:18px 12px;line-height:1.6}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px;
  font-family:var(--mono);font-size:.58rem;letter-spacing:.13em;text-transform:uppercase;color:var(--cream-3)}
.warn{background:rgba(235,183,83,.15);border-radius:var(--r2);padding:12px 14px;font-size:.78rem;color:var(--gold-2);
  margin-bottom:12px;line-height:1.55}

/* ---------- gate, boot, desk ---------- */
#boot{position:fixed;inset:0;z-index:80;display:grid;place-items:center;text-align:center;padding:30px;
  background:radial-gradient(680px 600px at 2% 104%, rgba(72,5,10,.72), transparent 62%),
    linear-gradient(172deg,#C4181F 0%,#A31319 46%,#7A0D12 100%);
  transition:opacity .4s var(--ease),visibility .4s}
#boot.gone{opacity:0;visibility:hidden}
/* THE CARD, TURNED OVER AT THE COUNTER.
   A membership card in three dimensions: crimson, the crest on the front, the
   name of the college on the back in the same mono capitals the page uses.
   It turns slowly in the air over its own shadow while the register is read,
   which is what a porter does with a card: takes it, turns it, reads it. */
.stage{position:relative;width:180px;height:150px;margin:0 auto 14px;perspective:820px;perspective-origin:50% 45%}
.stage .shadow{position:absolute;left:50%;bottom:8px;width:120px;height:18px;margin-left:-60px;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(20,1,3,.55),rgba(20,1,3,0) 70%);
  animation:shade 4s cubic-bezier(.45,0,.55,1) infinite}
.cardx{position:absolute;left:50%;top:50%;width:150px;height:96px;margin:-56px 0 0 -75px;
  transform-style:preserve-3d;animation:turn 4s cubic-bezier(.45,0,.55,1) infinite}
.cardx .face{position:absolute;inset:0;border-radius:11px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:grid;place-items:center;box-shadow:0 0 0 1px rgba(0,0,0,.25),inset 0 0 0 1px rgba(255,255,255,.12)}
.cardx .front{background:linear-gradient(135deg,#8E0F14,#6B080D);transform:translateZ(1.5px)}
.cardx .front::after{content:"";position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(115deg,rgba(255,255,255,.22),transparent 38%,transparent 62%,rgba(255,255,255,.08));
  animation:sheen 4s cubic-bezier(.45,0,.55,1) infinite}
.cardx .front img{width:34px;height:auto;filter:drop-shadow(0 2px 4px rgba(0,0,0,.45))}
.cardx .front small{position:absolute;left:12px;bottom:9px;font-family:var(--mono);font-size:6.5px;letter-spacing:.2em;
  text-transform:uppercase;color:rgba(251,243,236,.78);font-weight:700}
.cardx .front i{position:absolute;right:12px;bottom:9px;width:22px;height:14px;border-radius:3px;
  background:linear-gradient(135deg,#E2C58C,#B8933F);opacity:.9}
.cardx .back{background:var(--paper);color:var(--ink);transform:rotateY(180deg) translateZ(1.5px);
  display:block;padding:12px 13px;text-align:left}
.cardx .back b{display:block;font-family:var(--display);font-size:11px;font-weight:600;letter-spacing:-.02em;color:var(--crimson-3)}
.cardx .back small{display:block;font-family:var(--mono);font-size:6px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink-soft);font-weight:700;margin-top:2px}
.cardx .back u{position:absolute;left:0;right:0;top:36px;height:10px;background:var(--ink);opacity:.85}
.cardx .back em{position:absolute;left:13px;right:13px;bottom:12px;height:12px;border-radius:2px;background:var(--cream-2);
  font-style:normal}
.cardx .edge{position:absolute;inset:0;border-radius:11px;background:#4A060A;transform:translateZ(0)}
@keyframes turn{0%{transform:rotateX(14deg) rotateY(0) translateY(0)}50%{transform:rotateX(14deg) rotateY(180deg) translateY(-6px)}
  100%{transform:rotateX(14deg) rotateY(360deg) translateY(0)}}
@keyframes shade{0%,100%{transform:scaleX(1);opacity:.9}50%{transform:scaleX(.72);opacity:.55}}
@keyframes sheen{0%,100%{opacity:.35}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.cardx{animation:none;transform:rotateX(14deg) rotateY(-18deg)}
  .stage .shadow,.cardx .front::after{animation:none}}
#boot b.wm2{display:block;font-family:var(--display);font-size:1.24rem;font-weight:600;letter-spacing:-.04em}
#boot b.wm2 i{font-style:italic;color:var(--gold-2);font-weight:400}
#boot span.line{display:block;font-family:var(--mono);font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--cream-3);margin-top:10px;font-weight:600}
#gate{display:grid;place-items:center;min-height:66dvh}
.gcard{max-width:420px;width:100%;background:var(--t1);border-radius:22px;padding:24px 22px}
.gcard .head{display:flex;align-items:center;gap:13px;margin-bottom:13px}
.gcard .head .crest{width:52px;height:52px;flex-basis:52px}
.gsiskel{display:block;height:44px;border-radius:999px;background:var(--t2)}
.lede{font-size:.8rem;color:var(--cream-3);line-height:1.6}
.msg{font-size:.76rem;color:#FFC9C9;min-height:1.2em;margin-top:9px;font-weight:700}
.card{background:var(--t1);border-radius:var(--r);padding:16px;margin-bottom:12px}
h2{font-family:var(--display);font-size:1.7rem;font-weight:600;letter-spacing:-.045em;margin:0 0 8px}
h2 i,h3 i{font-style:italic;color:var(--gold-2);font-weight:400}
h3{font-family:var(--display);font-size:1.04rem;font-weight:600;letter-spacing:-.03em;margin:0 0 6px}
.f{display:block;margin-bottom:11px}
.f .l{display:block;font-family:var(--mono);font-size:.6rem;color:var(--cream-3);margin-bottom:6px;letter-spacing:.14em;
  text-transform:uppercase;font-weight:700}
.f input,.f textarea{width:100%;background:rgba(0,0,0,.3);border:1px solid transparent;border-radius:12px;color:var(--cream);
  font:inherit;font-size:.88rem;padding:11px 13px;outline:0}
.f input:focus,.f textarea:focus{border-color:var(--gold)}
.f textarea{min-height:82px;resize:vertical;font-family:var(--mono);font-size:.78rem}
.btn{appearance:none;border:0;cursor:pointer;font-family:var(--body);font-weight:800;font-size:.8rem;border-radius:999px;
  padding:11px 18px;color:var(--gold-ink);background:var(--gold);display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn.ghost{background:transparent;color:var(--cream);box-shadow:inset 0 0 0 1.5px var(--edge-2)}
.btn.sm{padding:8px 14px;font-size:.73rem}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
#toast{position:fixed;left:50%;bottom:calc(20px + var(--sab));transform:translateX(-50%) translateY(80px);background:var(--cream);
  color:var(--ink);font-weight:800;font-size:.79rem;padding:11px 18px;border-radius:999px;transition:transform .3s var(--ease);z-index:90}
#toast.show{transform:translateX(-50%)}
.spin{width:13px;height:13px;border-radius:50%;border:2.5px solid rgba(0,0,0,.25);border-top-color:currentColor;display:inline-block;
  animation:spin .7s linear infinite;vertical-align:-2px}
</style>
</head>

<style>
/* ---------- the second factor, and the code cells ---------- */
.cells{display:flex;gap:7px;justify-content:center;margin:14px 0 4px}
.cells input{width:44px;height:56px;flex:0 0 44px;border-radius:12px;background:rgba(0,0,0,.34);
  border:1.5px solid transparent;color:var(--cream);font-family:var(--mono);font-size:1.5rem;text-align:center;
  outline:0;padding:0;caret-color:var(--gold)}
.cells input:focus{border-color:var(--gold);background:rgba(0,0,0,.44)}
.cells input.ok{border-color:rgba(79,200,148,.7)}
.cells i{align-self:center;width:8px;height:2px;background:var(--cream-4);border-radius:2px;flex:0 0 8px;opacity:.6}
@media(max-width:380px){.cells input{width:38px;height:50px;flex-basis:38px;font-size:1.3rem}}
.sentto{font-family:var(--mono);font-size:.72rem;color:var(--gold-2);word-break:break-all}

/* ---------- the visiting card ---------- */
.vcard{background:var(--t1);border-radius:var(--r);padding:14px 15px;margin-bottom:10px}
.vcard .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.vcard .top b{font-family:var(--display);font-size:1.06rem;font-weight:600;letter-spacing:-.03em}
.vcard .top .on{margin-left:auto;font-family:var(--mono);font-size:.62rem;letter-spacing:.13em;
  text-transform:uppercase;color:var(--gold-2);font-weight:700}
.vcard .em{font-family:var(--mono);font-size:.7rem;color:var(--cream-4);margin-top:3px;word-break:break-all}
.pair{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin-top:10px;font-size:.8rem}
.pair b{font-family:var(--mono);font-size:.58rem;letter-spacing:.13em;text-transform:uppercase;
  color:var(--cream-4);font-weight:700;padding-top:3px}
.pair span{min-width:0;overflow-wrap:anywhere}
.pair span em{font-style:normal;font-family:var(--mono);font-size:.68rem;color:var(--cream-4);display:block}

/* ---------- the board ---------- */
.notice{background:var(--t1);border-radius:var(--r2);padding:12px 14px;margin-bottom:9px}
.notice b{display:block;font-size:.9rem;letter-spacing:-.015em}
.notice p{font-size:.78rem;color:var(--cream-3);margin-top:4px;white-space:pre-wrap}
.notice .by{font-family:var(--mono);font-size:.58rem;letter-spacing:.13em;text-transform:uppercase;
  color:var(--cream-4);margin-top:7px;font-weight:700}
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{flex:1;border:0;cursor:pointer;font:inherit;font-size:.76rem;font-weight:800;padding:9px 8px;
  border-radius:999px;background:var(--t1);color:var(--cream-3)}
.seg button[aria-current="true"]{background:var(--gold);color:var(--gold-ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chips button{border:0;cursor:pointer;font:inherit;font-size:.68rem;font-weight:700;padding:7px 12px;
  border-radius:999px;background:var(--t1);color:var(--cream-3)}
.chips button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink)}

/* ---------- printing ----------
   The Lodge prints these and pins them up, so the printed page is designed
   rather than whatever the screen happens to look like in black and white. */
#print{display:none}
@media print{
  body{background:#fff!important;color:#000!important}
  .wrap,header,#gate,#boot,#toast,.noprint{display:none!important}
  #print{display:block!important;padding:0;margin:0;font-family:'Manrope',Arial,sans-serif;color:#000}
  #print h1{font-family:'Fraunces',Georgia,serif;font-size:19pt;font-weight:600;letter-spacing:-.02em;margin:0}
  #print .sub{font-family:'JetBrains Mono',monospace;font-size:7.5pt;letter-spacing:.14em;text-transform:uppercase;
    color:#555;margin:5pt 0 12pt;border-bottom:1pt solid #000;padding-bottom:7pt}
  #print table{width:100%;border-collapse:collapse;font-size:9pt}
  #print th{text-align:left;font-family:'JetBrains Mono',monospace;font-size:6.8pt;letter-spacing:.12em;
    text-transform:uppercase;color:#555;border-bottom:.6pt solid #999;padding:5pt 6pt 4pt 0}
  #print td{padding:5pt 6pt 5pt 0;border-bottom:.4pt solid #ddd;vertical-align:top}
  #print td.n{font-weight:700}
  #print td.m{font-family:'JetBrains Mono',monospace;font-size:8pt;color:#333}
  #print tr{page-break-inside:avoid}
  #print .foot{margin-top:12pt;font-family:'JetBrains Mono',monospace;font-size:7pt;color:#666;
    letter-spacing:.1em;text-transform:uppercase}
  @page{margin:14mm}
}
</style>

const API_URL = "https://script.google.com/macros/s/AKfycbydF6IOT28i3zLJbBBh-d1PdZhKeVsN75rJSsqYPz7l8hl1OgVnvDXL1bbrtNBh1sJ_/exec";

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const TOKEN_KEY = "lodge_token";
const getToken = () => { try{ return localStorage.getItem(TOKEN_KEY) || ""; }catch(e){ return ""; } };
const setToken = t => { try{ t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); }catch(e){} };
const bridge = () => (window.google && google.script && google.script.run) ? google.script.run : null;
function api(action, payload){
  const body = Object.assign({ action, token: getToken() || "" }, payload || {});
  return bridge()
    ? new Promise((res, rej) => bridge().withSuccessHandler(t => { try{ res(unpack(t)); }catch(e){ rej(e); } })
        .withFailureHandler(rej).apiCall(JSON.stringify(body)))
    : fetch(API_URL, { method:"POST", body: JSON.stringify(body),
        headers:{ "Content-Type":"text/plain;charset=utf-8" }, redirect:"follow" }).then(r => r.text()).then(unpack);
}
function unpack(txt){
  let j; try{ j = JSON.parse(txt); }catch(e){ throw new Error("The server sent something unreadable."); }
  if (!j.ok) throw new Error(j.error || "Something went wrong.");
  return j.data;
}
let toastT;
function toast(m){ const e = $("toast"); e.textContent = m; e.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove("show"), 3800); }
function bootSay(t){ const e = $("bootLine"); if (e) e.textContent = t; }
function bootDone(){ const b = $("boot"); if (b){ b.classList.add("gone"); setTimeout(() => { b.hidden = true; }, 420); } }
const initials = n => String(n || "").split(/\s+/).filter(Boolean).map(w => w[0]).join("").slice(0,2).toUpperCase() || "?";
const clock = ms => !ms ? "" : new Date(Number(ms)).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
const day = ms => !ms ? "" : new Date(Number(ms)).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});

let S = null, q = "", tab = "all", view = "list", stage = "email", who = "", notices = null;

/* ---------- opening ---------- */
async function load(fresh){
  try{
    bootSay("Reading the register");
    S = await api("state", fresh ? { fresh: true } : {});
    $("gate").hidden = true; $("app").hidden = false;
    ["bOut","bSync"].forEach(i => $(i).hidden = false);
    $("bDesk").hidden = !S.admin;
    render(); bootDone();
  }catch(e){
    const m = String(e && e.message ? e.message : e);
    if (/sign in|session|access/i.test(m)){ setToken(""); $("app").hidden = true; openGate(m); return; }
    bootDone(); $("app").hidden = false;
    $("app").innerHTML = '<div class="card"><h3>That did not load</h3><p class="lede">' + esc(m) +
      '</p><div class="acts"><button class="btn" onclick="location.reload()">Try again</button></div></div>';
  }
}
async function openGate(msg){
  bootDone();
  $("gate").hidden = false;
  paintGate(msg);
}
/* Two steps, drawn separately, because they are two different questions:
   which account, and is somebody reading that mailbox now. */
function paintGate(msg){
  const box = $("gate").querySelector(".gcard");
  if (stage === "email"){
    box.innerHTML =
      '<div class="head"><img class="crest" alt="" src="' + CREST + '">' +
      '<span class="wm"><small style="margin:0 0 5px">Jesus College MCR</small><b>Welcome, <i>Porters</i></b></span></div>' +
      '<p class="lede" style="margin-bottom:14px">This screen tells you who is a member of the MCR, and who holds ' +
      'visiting membership. There is no password: give the Lodge address and a code will arrive in that mailbox.</p>' +
      '<label class="f"><span class="l">The Lodge address</span>' +
      '<input id="gEmail" inputmode="email" autocapitalize="off" spellcheck="false" autocomplete="username" ' +
      'value="' + esc(who) + '" placeholder="head-porter@jesus.cam.ac.uk" enterkeyhint="send"></label>' +
      '<div class="acts"><button class="btn" id="bAsk">Send me a code</button></div>' +
      '<p class="msg" id="gateMsg">' + esc(msg || "") + '</p>';
    const e = $("gEmail"), b = $("bAsk");
    b.onclick = doAsk;
    e.onkeydown = ev => { if (ev.key === "Enter") doAsk(); };
    setTimeout(() => e.focus(), 150);
  } else {
    box.innerHTML =
      '<div class="head"><img class="crest" alt="" src="' + CREST + '">' +
      '<span class="wm"><small style="margin:0 0 5px">Almost there</small><b>Your <i>code</i></b></span></div>' +
      '<p class="lede">Six digits are on their way to <span class="sentto">' + esc(who) + '</span>, ' +
      'good for ' + (S_MIN || 20) + ' minutes. If it is not there in a moment, do look in the junk folder.</p>' +
      cells() +
      '<div class="acts" style="justify-content:center;margin-top:10px">' +
      '<button class="btn" id="bVerify">Open the Lodge</button></div>' +
      '<div class="acts" style="justify-content:center;margin-top:8px">' +
      '<button class="btn ghost sm" id="bResend">Send another</button>' +
      '<button class="btn ghost sm" id="bStart">A different address</button></div>' +
      '<p class="msg" id="gateMsg">' + esc(msg || "") + '</p>';
    wireCells();
    $("bVerify").onclick = doVerify;
    $("bResend").onclick = doResend;
    $("bStart").onclick = () => { stage = "email"; openGate(); };
  }
}
let S_MIN = 15;
function cells(){
  let s = '<div class="cells" id="cells">';
  for (let i = 0; i < 6; i++){
    if (i === 3) s += '<i></i>';
    s += '<input inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="' +
      (i ? "off" : "one-time-code") + '" aria-label="digit ' + (i + 1) + '">';
  }
  return s + '</div>';
}
const codeValue = () => [...document.querySelectorAll("#cells input")].map(i => i.value).join("");
function wireCells(){
  const ins = [...document.querySelectorAll("#cells input")];
  ins.forEach((el, i) => {
    el.addEventListener("input", () => {
      el.value = el.value.replace(/\D/g,"").slice(-1);
      el.classList.toggle("ok", !!el.value);
      if (el.value && ins[i+1]) ins[i+1].focus();
      if (codeValue().length === 6) doVerify();
    });
    el.addEventListener("keydown", e => {
      if (e.key === "Backspace" && !el.value && ins[i-1]){ ins[i-1].value = ""; ins[i-1].classList.remove("ok"); ins[i-1].focus(); }
    });
    el.addEventListener("paste", e => {
      const t = (e.clipboardData || window.clipboardData).getData("text").replace(/\D/g,"");
      if (t.length < 2) return;
      e.preventDefault();
      t.slice(0,6).split("").forEach((ch, j) => { if (ins[j]){ ins[j].value = ch; ins[j].classList.add("ok"); } });
      if (codeValue().length === 6) doVerify();
    });
  });
  setTimeout(() => ins[0] && ins[0].focus(), 150);
}
async function doAsk(){
  const e = ($("gEmail").value || "").trim().toLowerCase();
  if (!e) return; 
  const b = $("bAsk"); b.disabled = true; b.innerHTML = '<span class="spin"></span>Sending';
  try{
    const r = await api("askCode", { email: e });
    who = r.to; S_MIN = r.minutes || 20; stage = "code";
    paintGate("");
    toast("A code is on its way to " + r.to);
  }catch(err){
    b.disabled = false; b.textContent = "Send me a code";
    $("gateMsg").textContent = err.message || String(err);
  }
}
async function doVerify(){
  const code = codeValue();
  if (code.length < 6) return;
  const b = $("bVerify"); b.disabled = true; b.innerHTML = '<span class="spin"></span>Checking';
  try{
    const r = await api("verifyCode", { email: who, code: code });
    setToken(r.token);
    stage = "email";
    await load();
  }catch(e){
    b.disabled = false; b.textContent = "Open the Lodge";
    $("gateMsg").textContent = e.message || String(e);
    document.querySelectorAll("#cells input").forEach(i => { i.value = ""; i.classList.remove("ok"); });
    const f = document.querySelector("#cells input"); if (f) f.focus();
  }
}
async function doResend(){
  const b = $("bResend"); b.disabled = true;
  try{ await api("askCode", { email: who, again: true }); toast("Another code is on its way."); }
  catch(e){ $("gateMsg").textContent = e.message || String(e); }
  setTimeout(() => { b.disabled = false; }, 4000);
}

/* ---------- the screen ---------- */
function everyone(){
  return (S.members || []).map(x => Object.assign({ kind:"member" }, x))
    .concat((S.visiting || []).map(x => Object.assign({ kind:"visiting" }, x)));
}
function match(p, needle){
  const n = needle.toLowerCase().trim();
  if (!n) return true;
  return (p.name||"").toLowerCase().indexOf(n) >= 0 || (p.key||"").indexOf(n) >= 0 ||
    (p.email||"").indexOf(n) >= 0 || (p.voucher||"").toLowerCase().indexOf(n) >= 0 ||
    (p.supervisor||"").toLowerCase().indexOf(n) >= 0;
}
const recent = () => (S.members || []).filter(m => m.at && Date.now() - m.at < (S.newDays || 7) * 86400000)
  .sort((a,b) => b.at - a.at);

function render(){
  if (view === "board") return renderBoard();
  if (view === "settings") return renderSettings();
  const all = everyone();
  const pool = tab === "members" ? all.filter(p => p.kind === "member")
    : tab === "visiting" ? all.filter(p => p.kind === "visiting") : all;
  const hits = pool.filter(p => match(p, q));
  const nM = (S.members||[]).length, nV = (S.visiting||[]).length, nR = recent().length;
  $("app").innerHTML =
    (S.membersOk ? "" : '<div class="warn">The MCR register could not be read, so this list may be empty or out of date. Tell the President.</div>') +
    (S.visitingSet && !S.visitingOk ? '<div class="warn">The visiting membership list could not be read.</div>' : '') +
    seg() +
    '<div class="hunt"><input id="q" value="' + esc(q) + '" placeholder="Name, CRSid, email, or a nominator" ' +
      'autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">' +
      (q ? '<button class="x" id="qx" title="Clear">&times;</button>' : '') + '</div>' +
    '<div class="tabs">' + tabBtn("all","Everyone",nM+nV) + tabBtn("members","MCR members",nM) +
      tabBtn("visiting","Visiting",nV) + '</div>' +
    (q ? answer(hits) : "") +
    (tab === "visiting" ? visitingList(hits) : listing(hits, !q)) +
    '<div class="chips" style="margin-top:12px">' +
      '<button data-print="members">Print the whole membership</button>' +
      '<button data-print="recent">Print the last ' + (S.newDays||7) + ' days' + (nR ? " (" + nR + ")" : "") + '</button>' +
      '<button data-print="visiting">Print visiting members</button></div>' +
    '<div class="foot"><span>' + nM + ' members &middot; ' + nV + ' visiting</span>' +
    '<span>Read at ' + esc(clock(S.at)) + '</span></div>';
  wire();
}
function seg(){
  return '<div class="seg noprint">' +
    '<button data-view="list" aria-current="' + (view==="list") + '">Who is a member</button>' +
    '<button data-view="board" aria-current="' + (view==="board") + '">Notice board</button>' +
    (S.admin ? '<button data-view="settings" aria-current="' + (view==="settings") + '">Settings</button>' : '') +
    '</div>';
}
function tabBtn(k, label, n){
  return '<button data-tab="' + k + '" aria-current="' + (tab===k) + '">' + esc(label) + '<b>' + n + '</b></button>';
}
function answer(hits){
  if (!hits.length)
    return '<div class="answer no"><div class="verdict"><span class="mark">&times;</span><b>Not on either list</b></div>' +
      '<p class="det" style="margin-top:10px;opacity:.85">Nothing matching &ldquo;' + esc(q) + '&rdquo;. They may be an ' +
      'undergraduate, staff, or a guest. The MCR cannot vouch for them.</p></div>';
  if (hits.length > 1) return "";
  const p = hits[0], v = p.kind === "visiting";
  return '<div class="answer yes"><div class="verdict"><span class="mark">&check;</span>' +
    '<b>' + (v ? "Visiting member" : "MCR member") + '</b></div>' +
    '<div class="who">' + esc(p.name || p.key) + '</div>' +
    '<div class="det">' + esc(p.email || p.key) + (p.programme ? " &middot; " + esc(p.programme) : "") + '</div>' +
    (v ? '<span class="tag">Approved ' + esc(day(p.at)) + (p.voucher ? " &middot; vouched by " + esc(p.voucher) : "") + '</span>'
       : p.fresher ? '<span class="tag">Fresher, ' + esc(p.year || "this year") + '</span>' : "") + '</div>';
}
function listing(hits, grouped){
  if (!hits.length) return q ? "" : '<div class="rows"><p class="note">Nothing to show.</p></div>';
  let out = '<div class="rows">', last = "";
  hits.slice(0, 400).forEach(p => {
    const nm = p.name || p.key;
    if (grouped){
      const L = (nm[0] || "?").toUpperCase();
      if (L !== last){ out += '<div class="letter">' + esc(L) + '</div>'; last = L; }
    }
    out += '<div class="row' + (p.kind==="visiting" ? " v" : "") + '" data-pick="' + esc(p.key) + '" tabindex="0">' +
      '<span class="av">' + esc(initials(nm)) + '</span>' +
      '<span class="t"><b>' + esc(nm) + '</b><span>' + esc(p.email || p.key) +
        (p.programme ? " &middot; " + esc(p.programme) : "") + '</span></span>' +
      '<span class="pin">' + (p.kind==="visiting" ? "visiting" : "member") + '</span></div>';
  });
  if (hits.length > 400) out += '<p class="note">' + (hits.length - 400) + ' more. Type a name to narrow it.</p>';
  return out + '</div>';
}
/* The visiting list is read differently: the Lodge wants to see, at a glance,
   who vouched for somebody and when the committee said yes. */
function visitingList(hits){
  if (!hits.length) return '<div class="rows"><p class="note">Nobody yet.</p></div>';
  return hits.map(p =>
    '<div class="vcard"><div class="top"><b>' + esc(p.name || p.key) + '</b>' +
    '<span class="on">Approved ' + esc(day(p.at)) + '</span></div>' +
    '<div class="em">' + esc(p.email || p.key) + '</div>' +
    '<div class="pair">' +
    '<b>Vouched by</b><span>' + esc(p.voucher || "\u2014") +
      (p.voucherEmail ? '<em>' + esc(p.voucherEmail) + (p.voucherRole ? " &middot; " + esc(p.voucherRole) : "") + '</em>' : '') + '</span>' +
    '<b>Supervisor</b><span>' + esc(p.supervisor || "\u2014") +
      (p.supervisorEmail ? '<em>' + esc(p.supervisorEmail) + (p.supervisorDept ? " &middot; " + esc(p.supervisorDept) : "") + '</em>' : '') + '</span>' +
    '</div></div>').join("");
}
function wire(){
  const box = $("q");
  if (box){
    box.oninput = () => { q = box.value; render(); };
    box.onkeydown = e => { if (e.key === "Escape"){ q = ""; render(); } };
    if (document.activeElement !== box){ const at = box.value.length; box.focus();
      try{ box.setSelectionRange(at, at); }catch(e){} }
  }
  const x = $("qx"); if (x) x.onclick = () => { q = ""; render(); };
  document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
  document.querySelectorAll("[data-view]").forEach(b => b.onclick = () => { view = b.dataset.view; render(); });
  document.querySelectorAll("[data-pick]").forEach(r => {
    const go = () => { q = r.dataset.pick; render(); };
    r.onclick = go;
    r.onkeydown = e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); go(); } };
  });
  document.querySelectorAll("[data-print]").forEach(b => b.onclick = () => print_(b.dataset.print));
}

/* ---------- settings: who may open this screen ---------- */
function renderSettings(){
  const admins = (S.admins || []), porters = (S.porters || []);
  $("app").innerHTML = seg() +
    '<div class="card"><h3>Who may open the <i>Lodge screen</i></h3>' +
    '<p class="lede">Anybody here can sign in with a code sent to their address. The two below are ' +
    'written into the app and cannot be removed, so the Lodge is never locked out of its own screen.</p>' +
    '<div class="rows" style="margin-top:12px">' +
    admins.map(a => '<div class="row"><span class="av">' + esc(initials(a)) + '</span>' +
      '<span class="t"><b>' + esc(a) + '</b><span>always allowed</span></span>' +
      '<span class="pin">fixed</span></div>').join("") + '</div>' +
    '<label class="f" style="margin-top:16px"><span class="l">Other Lodge addresses, one per line</span>' +
    '<textarea id="pl" placeholder="deputy-head-porter@jesus.cam.ac.uk">' + esc(porters.join("\n")) + '</textarea></label>' +
    '<p class="lede">Anybody removed here is signed out at their next keystroke, not in thirty days.</p>' +
    '<div class="acts"><button class="btn" id="bSaveP">Save the list</button></div></div>' +
    '<div class="card"><h3>Where these lists <i>come from</i></h3>' +
    '<p class="lede">Nothing on this screen is typed in here. Members are read from the MCR register, and ' +
    'visiting members from the visiting membership app, every few minutes. A name that is wrong is put right ' +
    'in whichever of those it came from, and it corrects itself here.</p>' +
    '<div class="foot" style="margin-top:12px"><span>' + (S.membersOk ? "Register: reading" : "Register: NOT READING") + '</span>' +
    '<span>' + (S.visitingOk ? "Visiting: reading" : "Visiting: NOT READING") + '</span></div></div>';
  document.querySelectorAll("[data-view]").forEach(b => b.onclick = () => { view = b.dataset.view; render(); });
  const sv = $("bSaveP");
  if (sv) sv.onclick = async () => {
    sv.disabled = true; sv.innerHTML = '<span class="spin"></span>Saving';
    try{ const r = await api("portersSet", { porters: $("pl").value });
      S.porters = r.porters; S.admins = r.admins; renderSettings(); toast("Saved."); }
    catch(e){ toast(e.message || String(e)); sv.disabled = false; sv.textContent = "Save the list"; }
  };
}

/* ---------- printing ---------- */
function print_(which){
  const now = new Date().toLocaleString("en-GB", { dateStyle:"long", timeStyle:"short" });
  let title = "", sub = "", head = "", body = "", n = 0;
  if (which === "visiting"){
    const rows = (S.visiting || []).slice().sort((a,b) => (b.at||0) - (a.at||0));
    n = rows.length;
    title = "Visiting members of the MCR";
    head = "<tr><th>Name</th><th>Email</th><th>Vouched by</th><th>Supervisor</th><th>Approved</th></tr>";
    body = rows.map(p => "<tr><td class='n'>" + esc(p.name || p.key) + "</td>" +
      "<td class='m'>" + esc(p.email) + "</td>" +
      "<td>" + esc(p.voucher || "") + (p.voucherEmail ? "<br><span class='m'>" + esc(p.voucherEmail) + "</span>" : "") + "</td>" +
      "<td>" + esc(p.supervisor || "") + (p.supervisorDept ? "<br><span class='m'>" + esc(p.supervisorDept) + "</span>" : "") + "</td>" +
      "<td class='m'>" + esc(day(p.at)) + "</td></tr>").join("");
  } else {
    const rows = which === "recent" ? recent() : (S.members || []).slice().sort((a,b) =>
      String(a.name||a.key).localeCompare(String(b.name||b.key)));
    n = rows.length;
    title = which === "recent" ? "Joined in the last " + (S.newDays||7) + " days" : "Members of the MCR";
    head = "<tr><th>Name</th><th>Course</th><th>Email</th>" + (which === "recent" ? "<th>Joined</th>" : "") + "</tr>";
    body = rows.map(p => "<tr><td class='n'>" + esc(p.name || p.key) + "</td>" +
      "<td>" + esc(p.programme || "") + "</td>" +
      "<td class='m'>" + esc(p.email) + "</td>" +
      (which === "recent" ? "<td class='m'>" + esc(day(p.at)) + "</td>" : "") + "</tr>").join("");
  }
  if (!n) return toast("Nothing to print in that list.");
  sub = "Jesus College MCR &middot; " + n + (n === 1 ? " person" : " people") + " &middot; printed " + esc(now);
  $("print").innerHTML = "<h1>" + esc(title) + "</h1><div class='sub'>" + sub + "</div>" +
    "<table>" + head + body + "</table>" +
    "<div class='foot'>Read from the MCR register at " + esc(clock(S.at)) +
    ". Not a public document: keep it at the Lodge.</div>";
  setTimeout(() => window.print(), 60);
}

/* ---------- the board ---------- */
async function renderBoard(){
  $("app").innerHTML = seg() +
    '<div class="card"><h3>Put something on the <i>board</i></h3>' +
    (S.canPost ? '<p class="lede">This goes straight onto the MCR notice board, from the Lodge, and shows on ' +
      'everybody&rsquo;s phone at once.</p>' +
      '<label class="f" style="margin-top:12px"><span class="l">Heading</span>' +
      '<input id="nT" placeholder="Chimney gate closed on Sunday morning"></label>' +
      '<label class="f"><span class="l">The notice</span><textarea id="nB" placeholder="A line or two. Say when it starts and when it ends."></textarea></label>' +
      '<div class="chips" id="nK">' +
      ['general','access','works','weather','post','lost','urgent'].map(k =>
        '<button data-kind="' + k + '" aria-pressed="' + (k === "general") + '">' + k + '</button>').join("") + '</div>' +
      '<div class="acts"><button class="btn" id="bPost">Put it up</button></div>'
      : '<p class="lede">Not wired to The Chimney yet. The President needs to fill in CHIMNEY_URL and CHIMNEY_SHEET_ID.</p>') +
    '</div>' +
    (S.canNews ? '<div class="card"><h3>A line on the Fortnight <i>news</i></h3>' +
      '<p class="lede">For the fortnight only: goes to the news tab of the Freshers\u2019 app.</p>' +
      '<label class="f" style="margin-top:12px"><span class="l">The update</span>' +
      '<textarea id="fT" placeholder="Punting is off this afternoon, the river is too high."></textarea></label>' +
      '<div class="acts"><button class="btn ghost" id="bNews">Post to the Fortnight</button></div></div>' : "") +
    '<div class="grp" style="font-family:var(--mono);font-size:.64rem;letter-spacing:.17em;text-transform:uppercase;' +
    'color:var(--gold-2);margin:22px 0 12px;font-weight:600">On the board now</div>' +
    '<div id="board"><p class="note">Reading the board</p></div>';
  document.querySelectorAll("[data-view]").forEach(b => b.onclick = () => { view = b.dataset.view; render(); });
  document.querySelectorAll("#nK button").forEach(b => b.onclick = () => {
    document.querySelectorAll("#nK button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  });
  const post = $("bPost");
  if (post) post.onclick = async () => {
    const t = ($("nT").value || "").trim();
    if (!t) return toast("Give it a heading.");
    post.disabled = true; post.innerHTML = '<span class="spin"></span>Putting it up';
    try{
      const kind = (document.querySelector('#nK button[aria-pressed="true"]') || {}).dataset?.kind || "general";
      const r = await api("noticePost", { title: t, body: $("nB").value, kind: kind });
      notices = r.notices; $("nT").value = ""; $("nB").value = "";
      paintBoard(); toast("It is on the board.");
    }catch(e){ toast(e.message || String(e)); }
    post.disabled = false; post.textContent = "Put it up";
  };
  const news = $("bNews");
  if (news) news.onclick = async () => {
    const t = ($("fT").value || "").trim();
    if (!t) return toast("Write the update first.");
    news.disabled = true; news.innerHTML = '<span class="spin"></span>Posting';
    try{ await api("freshersPost", { text: t }); $("fT").value = ""; toast("Posted to the Fortnight."); }
    catch(e){ toast(e.message || String(e)); }
    news.disabled = false; news.textContent = "Post to the Fortnight";
  };
  if (notices === null){
    try{ const r = await api("notices"); notices = r.ok ? r.notices : []; if (!r.ok) toast(r.error); }
    catch(e){ notices = []; toast(e.message || String(e)); }
  }
  paintBoard();
}
function paintBoard(){
  const b = $("board");
  if (!b) return;
  b.innerHTML = (notices && notices.length)
    ? notices.map(n => '<div class="notice"><b>' + esc(n.title) + '</b>' +
        (n.body ? '<p>' + esc(n.body) + '</p>' : '') +
        '<div class="by">' + esc(n.kind || "general") + (n.by ? " &middot; " + esc(n.by) : "") + '</div></div>').join("")
    : '<p class="note">Nothing on the board.</p>';
}

$("bOut").onclick = async () => { try{ await api("signOut"); }catch(e){} setToken(""); location.reload(); };
$("bSync").onclick = async () => { toast("Reading the register again"); await load(true); toast("Up to date."); };
$("bDesk").onclick = () => { view = (S && S.admin) ? (view === "settings" ? "list" : "settings") : (view === "board" ? "list" : "board"); render(); };
/* A porter types straight at the screen without touching the box first. */
addEventListener("keydown", e => {
  if (!S || view !== "list" || e.metaKey || e.ctrlKey || e.altKey) return;
  const box = $("q");
  if (box && document.activeElement !== box && /^[a-zA-Z0-9]$/.test(e.key)) box.focus();
});

if (getToken()) load(); else openGate();
</script>
</body>

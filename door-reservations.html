<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8E0F14">
<title>Door Reservations · Jesus College MCR</title>
<style>
:root{--crimson:#B4141B;--crimson2:#8E0F14;--crimson3:#6B080D;--cream:#FBF3EC;--cream2:#F2E4D8;--paper:#FFFDFA;--ink:#2A1012;--soft:#8C6062;--gold:#E2A93C;--gold2:#F7DDA6;--moss:#3F7A57;--line:#E2CDBC;--ui:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--display:Georgia,"Times New Roman",serif}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#B4141B,#780A10);color:var(--cream);font-family:var(--ui);-webkit-font-smoothing:antialiased}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.app{max-width:900px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 14px calc(30px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}.mark{width:44px;height:44px;border-radius:50%;background:var(--cream);color:var(--crimson3);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:20px;box-shadow:0 6px 20px #0003}.top h1{font-family:var(--display);font-size:23px;line-height:1;margin:0}.top p{margin:3px 0 0;color:#fff9;font-size:12px}
.card{background:var(--cream);color:var(--ink);border-radius:18px;box-shadow:0 18px 40px #2a101255;padding:16px}.gate{max-width:520px;margin:14vh auto 0}.gate h2{font-family:var(--display);font-size:28px;margin:0 0 6px;color:var(--crimson3)}.gate p{color:var(--soft);line-height:1.5}.msg{font-size:13px;color:var(--crimson);font-weight:600;margin-top:10px}.msg.ok{color:var(--moss)}
.toolbar{display:flex;gap:10px;position:sticky;top:0;z-index:20;padding:4px 0 12px;background:linear-gradient(#8E0F14 75%,transparent);backdrop-filter:blur(5px)}.search{flex:1;min-width:0;border:0;border-radius:14px;padding:13px 14px;background:var(--cream);color:var(--ink);outline:none;box-shadow:0 8px 24px #2a101233}.refresh{border:1px solid #ffffff33;background:#ffffff12;color:#fff;border-radius:14px;padding:0 15px;font-weight:700}.refresh.busy{opacity:.6;pointer-events:none}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.stat{background:#ffffff17;border:1px solid #ffffff24;border-radius:12px;padding:8px 11px}.stat b{font-size:16px}.stat span{font-size:11px;color:#fff9;margin-left:5px}
.event{background:var(--cream);color:var(--ink);border-radius:16px;margin:10px 0;overflow:hidden;box-shadow:0 12px 30px #2a101233}.eventHead{width:100%;border:0;background:none;text-align:left;padding:14px 15px;display:flex;align-items:center;gap:12px}.eventHead:active{background:var(--cream2)}.datebox{flex:none;width:48px;text-align:center;color:var(--crimson)}.datebox b{display:block;font-family:var(--display);font-size:26px;line-height:1}.datebox small{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.1em;font-weight:700}.eventTitle{min-width:0;flex:1}.eventTitle b{display:block;font-family:var(--display);font-size:18px;line-height:1.18;color:var(--crimson3)}.eventTitle small{display:block;color:var(--soft);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chev{font-size:24px;color:var(--soft);transition:transform .16s}.event.open .chev{transform:rotate(90deg)}
.list{border-top:1px solid var(--line);padding:10px}.listbar{display:flex;gap:8px;align-items:center;margin-bottom:8px}.listbar input{flex:1;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:11px;padding:10px 11px}.count{font-size:11px;color:var(--soft);white-space:nowrap}.person{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 11px;margin:7px 0}.avatar{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--crimson);color:#fff;font-family:var(--display);font-weight:700}.personMain{min-width:0;flex:1}.personMain b{display:block;font-size:15px}.personMain small{display:block;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}.tag{font-size:10px;font-weight:700;border-radius:999px;padding:3px 7px;background:var(--cream2);color:var(--ink-2,#5B3235)}.tag.gold{background:var(--gold2);color:#4A2E00}.tag.red{background:#F7D9D7;color:var(--crimson3)}.check{flex:none;border:0;border-radius:10px;padding:9px 10px;font-size:12px;font-weight:800;background:var(--crimson);color:#fff}.check.done{background:var(--moss)}.check:disabled{opacity:.65;cursor:default}.empty{padding:25px 10px;text-align:center;color:var(--soft);font-size:13px}.empty b{display:block;font-family:var(--display);font-size:18px;color:var(--ink);margin-bottom:3px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 15px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:50;box-shadow:0 10px 30px #0005}#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:560px){.app{padding-left:10px;padding-right:10px}.top h1{font-size:21px}.eventTitle b{font-size:17px}.person{align-items:flex-start}.check{padding:10px 8px}.stats{margin-bottom:8px}}
</style>
</head>
<body>
<div id="gate" class="app gate">
  <div class="card">
    <h2>Door Reservations</h2>
    <p>Sign in with your University of Cambridge Google account to open the live reservation lists.</p>
    <div id="gsiBtn"></div>
    <div id="gateMsg" class="msg"></div>
  </div>
</div>
<div id="app" class="app hidden">
  <div class="top"><div class="mark">J</div><div><h1>Door Reservations</h1><p>Jesus College MCR · live reservation lists</p></div></div>
  <div class="toolbar"><input id="search" class="search" type="search" placeholder="Search all reservations..." autocomplete="off"><button id="refresh" class="refresh">Refresh</button></div>
  <div id="stats" class="stats"></div>
  <div id="events"></div>
</div>
<div id="toast"></div>
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxktOxbd030YrWSwY1M91dn2z96YoK9_wLR58pByZTphKTzH4obU7b75pZ6N-IQd6id/exec";
const TK="mcr-ff26", GSI_KEY="mcr-ff26-gsi"; let token=null,S=null,gsiScript=null,gsiUp=false,lastCred="";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function cookieGet(n){const m=document.cookie.match(new RegExp("(?:^|; )"+n+"=([^;]*)"));return m?decodeURIComponent(m[1]):null}
function cookieSet(n,v,days){try{const a=[n+"="+encodeURIComponent(v),"path=/","max-age="+(days*86400),"SameSite=None"];if(location.protocol==="https:")a.push("Secure");document.cookie=a.join(";")}catch(e){}}
function getToken(){try{let v=localStorage.getItem(TK);if(v)return v}catch(e){}try{let v=sessionStorage.getItem(TK);if(v)return v}catch(e){}return cookieGet(TK)}
function setToken(t){token=t;try{localStorage.setItem(TK,t)}catch(e){}try{sessionStorage.setItem(TK,t)}catch(e){}cookieSet(TK,t,60)}
function clearToken(){token=null;try{localStorage.removeItem(TK)}catch(e){}try{sessionStorage.removeItem(TK)}catch(e){}cookieSet(TK,"",-1)}
function unpack(txt){let out;try{out=JSON.parse(txt)}catch(e){throw new Error("The server returned an unexpected response. Try refreshing.")}if(!out.ok)throw new Error(out.error||"Something went wrong");return out.data}
async function api(action,payload){const body=Object.assign({action,token:getToken()||""},payload||{});let txt;const ctl="AbortController"in window?new AbortController():null;const timer=ctl?setTimeout(()=>ctl.abort(),90000):null;try{const res=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body),redirect:"follow",signal:ctl?ctl.signal:undefined});txt=await res.text()}catch(e){throw new Error(e.name==="AbortError"?"The server did not answer in time.":"Could not reach the reservation server. Check the connection and try again.")}finally{if(timer)clearTimeout(timer)}return unpack(txt)}
function gsiKept(){try{const o=JSON.parse(localStorage.getItem(GSI_KEY)||"null");return o&&o.ready&&o.clientId?o:null}catch(e){return null}}
function gsiKeep(c){try{if(c&&c.ready&&c.clientId)localStorage.setItem(GSI_KEY,JSON.stringify(c));}catch(e){}}
function preloadGsi(){if(gsiScript)return gsiScript;const s=document.createElement("script");s.src="https://accounts.google.com/gsi/client";s.async=true;s.defer=true;document.head.appendChild(s);gsiScript=s;return s}
function openToast(t){const x=$("toast");x.textContent=t;x.classList.add("show");clearTimeout(openToast.t);openToast.t=setTimeout(()=>x.classList.remove("show"),2200)}
async function startGsi(cfg){if(gsiUp)return;gsiUp=true;if(!cfg||!cfg.ready){$("gateMsg").textContent="Google sign-in is not configured on the server.";return}window.handleGsi=async res=>{lastCred=res.credential;$("gateMsg").textContent="Checking access…";try{const r=await api("googleToken",{credential:res.credential});if(r&&r.bookDown)throw new Error("The MCR register is temporarily unavailable.");if(r&&r.needsBook)throw new Error("Your account is not authorised for this application.");setToken(r.token);const state=r.state&&r.state.me?r.state:await api("state");if(!state||!state.me||state.me.role!=="committee")throw new Error("Door Reservations is restricted to committee access.");S=state;$("gate").classList.add("hidden");$("app").classList.remove("hidden");render();startPolling()}catch(e){clearToken();$("gateMsg").textContent=e.message}};const draw=()=>{if(!window.google||!window.google.accounts||!window.google.accounts.id){setTimeout(draw,200);return}window.google.accounts.id.initialize({client_id:cfg.clientId,callback:window.handleGsi,hd:cfg.hd||undefined,ux_mode:"popup",auto_select:false});$("gsiBtn").innerHTML="";window.google.accounts.id.renderButton($("gsiBtn"),{theme:"filled_blue",size:"large",shape:"pill",width:280,text:"signin_with",logo_alignment:"center"})};const s=preloadGsi();if(window.google&&window.google.accounts&&window.google.accounts.id)draw();else s.addEventListener("load",draw)}
async function openGate(){try{const kept=gsiKept();if(kept)startGsi(kept);const p=await api("ping");gsiKeep(p.signIn);if(!kept)startGsi(p.signIn)}catch(e){$("gateMsg").textContent=e.message}}
function startPolling(){clearInterval(startPolling.t);startPolling.t=setInterval(()=>refresh(true),45000)}
async function refresh(quiet){const b=$("refresh");if(!quiet)b.classList.add("busy");try{const s=await api("state");if(s&&s.me&&s.me.role!=="committee")throw new Error("Door Reservations is restricted to committee access.");S=s;render()}catch(e){if(!quiet)openToast(e.message)}finally{if(!quiet)b.classList.remove("busy")}}
function shortDate(d){const x=new Date(d+"T12:00:00Z");return x.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",timeZone:"UTC"})}
function initials(n){return String(n||"?").split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join("").toUpperCase()||"?"}
function rowsFor(ev,q){const rows=((S.rsvps||{})[ev.id]||[]).filter(r=>r.status==="going"||r.status==="waitlist");const query=(q||"").trim().toLowerCase();return rows.filter(r=>!query||[r.name,r.email,r.programme,r.slot,r.choice].filter(Boolean).some(x=>String(x).toLowerCase().includes(query))).sort((a,b)=>{const ao=a.status==="going"?0:1,bo=b.status==="going"?0:1;return ao-bo||(a.at||0)-(b.at||0)})}
function personHTML(ev,r,i){const going=r.status==="going", checked=!!r.checkedIn;let tags=[];if(going)tags.push('<span class="tag">Reserved</span>');else tags.push('<span class="tag gold">Waitlist</span>');if(r.guests)tags.push('<span class="tag gold">+'+esc(r.guests)+' guest'+(Number(r.guests)===1?'':'s')+'</span>');if(r.slot)tags.push('<span class="tag">'+esc(r.slot)+'</span>');if(r.choice)tags.push('<span class="tag">'+esc(r.choice)+'</span>');return '<div class="person"><div class="avatar">'+esc(initials(r.name||r.email))+'</div><div class="personMain"><b>'+esc(r.name||String(r.email||"").split("@")[0])+'</b><small>'+esc(r.email||"")+(r.programme?' · '+esc(r.programme):'')+'</small><div class="tags">'+tags.join("")+'</div></div>'+(going?'<button class="check'+(checked?' done':'')+'" data-check="'+esc(ev.id)+'" data-email="'+esc(r.email)+'" '+(checked?'data-on="1"':'')+'>'+(checked?'Checked in':'Verify')+'</button>':'<span class="tag gold">Waiting</span>')+'</div>'}
function eventHTML(ev,idx){const all=((S.rsvps||{})[ev.id]||[]).filter(r=>r.status==="going"||r.status==="waitlist");const openState=window.openEvents&&window.openEvents[ev.id];const going=all.filter(r=>r.status==="going").length;const wait=all.filter(r=>r.status==="waitlist").length;const htmlRows=rowsFor(ev,"").map((r,i)=>personHTML(ev,r,i)).join("");return '<section class="event'+(openState?' open':'')+'" data-event="'+esc(ev.id)+'"><button class="eventHead" data-open-event="'+esc(ev.id)+'"><span class="datebox"><b>'+esc(String(ev.date||'').slice(-2))+'</b><small>'+esc(shortDate(ev.date).split(' ')[0])+'</small></span><span class="eventTitle"><b>'+esc(ev.title)+'</b><small>'+esc(ev.start||'')+(ev.venue?' · '+esc(ev.venue):'')+' · '+going+' reserved'+(wait?' · '+wait+' waiting':'')+'</small></span><span class="chev">›</span></button>'+(openState?'<div class="list"><div class="listbar"><input type="search" data-event-search="'+esc(ev.id)+'" placeholder="Search this reservation list..." autocomplete="off"><span class="count" data-count="'+esc(ev.id)+'">'+going+' reserved</span></div><div data-rows="'+esc(ev.id)+'">'+(htmlRows||'<div class="empty"><b>No reservations</b>There is nobody on the list yet.</div>')+'</div></div>':'')+'</section>'}
function render(){if(!S||!S.events)return;const events=(S.events||[]).slice().sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));const total=events.reduce((n,e)=>n+(((S.rsvps||{})[e.id]||[]).filter(r=>r.status==="going").length),0);$("stats").innerHTML='<div class="stat"><b>'+events.length+'</b><span>events</span></div><div class="stat"><b>'+total+'</b><span>reserved</span></div><div class="stat"><b>'+Object.values(S.rsvps||{}).reduce((n,a)=>n+(a||[]).filter(r=>r.status==="going"&&r.checkedIn).length,0)+'</b><span>checked in</span></div>';const q=$("search").value.trim().toLowerCase();$("events").innerHTML=events.filter(e=>{if(!q)return true;return e.title.toLowerCase().includes(q)||((S.rsvps||{})[e.id]||[]).some(r=>r.status!=="maybe"&&[r.name,r.email].some(x=>String(x||"").toLowerCase().includes(q)))}).map((e,i)=>eventHTML(e,i)).join("")||'<div class="card empty"><b>No matches</b>Try another name or event.</div>'}
function rerenderOpen(id,q){const ev=(S.events||[]).find(x=>x.id===id);if(!ev)return;const box=document.querySelector('[data-event="'+CSS.escape(id)+'"] [data-rows="'+CSS.escape(id)+'"]');if(!box)return;const rows=rowsFor(ev,q);box.innerHTML=rows.length?rows.map((r,i)=>personHTML(ev,r,i)).join(""):'<div class="empty"><b>No matches</b>Try another name.</div>';const c=document.querySelector('[data-event="'+CSS.escape(id)+'"] [data-count="'+CSS.escape(id)+'"]');if(c)c.textContent=rows.filter(r=>r.status==="going").length+" shown"}
$("search").addEventListener("input",render);$("refresh").addEventListener("click",()=>refresh(false));
window.openEvents={};
document.addEventListener("click",async e=>{const head=e.target.closest("[data-open-event]");if(head){const id=head.dataset.openEvent;window.openEvents[id]=!window.openEvents[id];render();if(window.openEvents[id])setTimeout(()=>document.querySelector('[data-event="'+CSS.escape(id)+'"] [data-event-search]')?.focus(),50);return}const chk=e.target.closest("[data-check]");if(chk){if(chk.dataset.working)return;const on=chk.dataset.on!=="1";chk.dataset.working="1";chk.disabled=true;try{await api("checkIn",{eventId:chk.dataset.check,email:chk.dataset.email,on});const r=((S.rsvps||{})[chk.dataset.check]||[]).find(x=>x.email===chk.dataset.email);if(r)r.checkedIn=on;render();openToast(on?"Checked in":"Check-in removed")}catch(err){openToast(err.message)}finally{delete chk.dataset.working}return}});
document.addEventListener("input",e=>{const x=e.target.closest("[data-event-search]");if(x)rerenderOpen(x.dataset.eventSearch,x.value)});
token=getToken();if(token){api("state").then(s=>{if(!s||!s.me||s.me.role!=="committee")throw new Error("Door Reservations is restricted to committee access.");S=s;$("gate").classList.add("hidden");$("app").classList.remove("hidden");render();startPolling()}).catch(()=>{clearToken();openGate()})}else openGate();
</script>
</body>
</html>

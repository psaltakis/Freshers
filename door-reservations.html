<style>

.eventHead{width:100%;display:flex;align-items:center;gap:12px;text-align:left;border:0;background:none;padding:13px 14px 13px 16px;color:inherit}.eventHead:hover{background:var(--cream-2)}.date{width:43px;flex:none;text-align:center;color:var(--crimson)}.date b{font-family:var(--display);display:block;font-size:27px;line-height:.95}.date small{font-family:var(--mono);display:block;font-size:8px;letter-spacing:.11em;text-transform:uppercase;margin-top:4px}.eventcopy{flex:1;min-width:0}.eventcopy b{display:block;font-family:var(--display);font-size:18px;line-height:1.18;color:var(--crimson-3)}.eventcopy small{display:block;color:var(--ink-soft);font-size:11.5px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pill{flex:none;font-family:var(--mono);font-size:9px;letter-spacing:.07em;text-transform:uppercase;border-radius:999px;padding:5px 8px;background:var(--cream-2);color:var(--ink-2)}.pill.gold{background:var(--gold-2);color:var(--gold-ink)}.chev{flex:none;color:var(--ink-soft);transition:.15s;font-size:22px;line-height:1}.event.open .chev{transform:rotate(90deg)}.eventMark{width:38px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--crimson-3);color:var(--gold-2);font-family:var(--display);font-weight:700;font-size:13px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}.event.open .eventMark{background:var(--ink)}.markWide{display:inline}.markSmall{display:none}@media(max-width:600px){.markWide{display:none}.markSmall{display:inline}}

.checkwrap{width:31px;height:31px;flex:none;display:grid;place-items:center;cursor:pointer}.doorcheck{position:absolute;opacity:0;width:1px;height:1px}.checkui{width:31px;height:31px;border-radius:9px;border:1.5px solid var(--crimson);background:var(--paper);display:grid;place-items:center;color:transparent;transition:.1s}.checkui svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.doorcheck:checked + .checkui{background:var(--moss);border-color:var(--moss);color:#fff}.doorcheck:focus-visible + .checkui{outline:2px solid var(--gold);outline-offset:2px}.checkwrap.saving{opacity:.55}.wait{font-family:var(--mono);font-size:8px;letter-spacing:.08em;text-transform:uppercase;color:#8a5f0d;white-space:nowrap}

.detailList .person{margin:8px 0;grid-template-columns:44px minmax(0,1fr) auto}.detailList .personMain b{font-size:16px}.detailList .personMain small{font-size:11.5px}.detailList .dietary{font-size:10.5px;padding:5px 8px}.detailHead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 11px}.detailHead h3{margin:0;font-family:var(--display);font-size:24px;color:var(--crimson-3)}.detailHead .mini{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}.doorHint{margin:-3px 0 12px;color:var(--ink-soft);font-size:12px}.empty{padding:28px 14px;text-align:center;color:var(--ink-soft)}.empty b{display:block;font-family:var(--display);font-size:20px;color:var(--ink);margin-bottom:3px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(16px);background:var(--ink);color:#fff;padding:10px 14px;border-radius:999px;font-size:12px;opacity:0;pointer-events:none;transition:.16s;z-index:100;box-shadow:0 10px 30px rgba(0,0,0,.3)}#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#gate{min-height:100vh;padding:18px;display:grid;place-items:center}.gateCard{background:var(--cream);color:var(--ink);width:min(520px,100%);border-radius:20px;box-shadow:var(--shadow);padding:23px 20px 17px}.gateBrand{display:flex;align-items:center;gap:14px;margin-bottom:18px}.gateLogo{width:58px;height:58px;object-fit:contain}.gateBrand small{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft)}.gateBrand b{display:block;font-family:var(--display);font-size:25px;line-height:1.04;color:var(--crimson-3)}.gateBrand i{font-style:italic;font-weight:300;color:var(--crimson)}.gateCard p{margin:0 0 17px;color:var(--ink-soft);font-size:14.5px}.msg{font-size:13px;color:var(--crimson);font-weight:600;margin-top:10px}

<div id="gate">
  <div class="gateCard">
    <div class="gateBrand"><img class="gateLogo" src="/favicon.svg" alt="Jesus College MCR"><span><small>Jesus College MCR</small><b>Door <i>Reservations</i></b></span></div>
    <p>Live reservation lists for the door. Sign in with your University of Cambridge Google account.</p>

  </div>
</div>
<div id="main" hidden>
  <header class="top"><div class="in"><img class="logo" src="/favicon.svg" alt="Jesus College MCR"><div class="wm"><b>Jesus College MCR</b><i>Door reservations · Freshers' Fortnight</i></div><div class="sp"></div><div class="live"><i></i>Live</div><button class="iconbtn" id="refresh" aria-label="Refresh reservations"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.8-4L3 10"/><path d="M3 5v5h5"/><path d="M4 13a8 8 0 0 0 14.8 4L21 14"/><path d="M21 19v-5h-5"/></svg></button></div></header>
  <main class="wrap"><div class="vh"><h1>Door <i>Reservations</i></h1><span class="note">Check the list at the door</span></div><div class="rule"></div>
    <div id="stats" class="stats"></div><div id="events"></div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbxktOxbd030YrWSwY1M91dn2z96YoK9_wLR58pByZTphKTzH4obU7b75pZ6N-IQd6id/exec";
const TK="mcr-ff26",GSI_KEY="mcr-ff26-gsi",CACHE="mcr-door-cache-v2";let token=null,S=null,gsiScript=null,gsiUp=false;const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function getToken(){try{let v=localStorage.getItem(TK);if(v)return v}catch(e){}try{let v=sessionStorage.getItem(TK);if(v)return v}catch(e){}return null}
function setToken(t){token=t;try{localStorage.setItem(TK,t);sessionStorage.setItem(TK,t)}catch(e){}}
function clearToken(){token=null;try{localStorage.removeItem(TK);sessionStorage.removeItem(TK)}catch(e){}}
function unpack(t){let x;try{x=JSON.parse(t)}catch(e){throw new Error("The reservation server returned an unexpected response.")}if(!x.ok){if(/sign in|session has expired/i.test(x.error||""))clearToken();throw new Error(x.error||"Something went wrong")}return x.data}
async function api(action,payload){const body=Object.assign({action,token:getToken()||""},payload||{});const ctl="AbortController"in window?new AbortController():null;const tm=ctl?setTimeout(()=>ctl.abort(),30000):null;try{const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body),redirect:"follow",signal:ctl?ctl.signal:undefined});return unpack(await r.text())}catch(e){throw new Error(e.name==="AbortError"?"The server took too long to answer.":"Could not reach the reservation server.")}finally{if(tm)clearTimeout(tm)}}
function toast(t){const x=$("toast");x.textContent=t;x.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>x.classList.remove("show"),1800)}
function shortDate(d){if(!d)return"";const x=new Date(d+"T12:00:00Z");return x.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",timeZone:"UTC"})}
function fullDate(d){if(!d)return"";const x=new Date(d+"T12:00:00Z");return x.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",timeZone:"UTC"})}
function initials(n){return String(n||"?").trim().split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join("").toUpperCase()||"?"}
function reservations(ev){return ((S.rsvps||{})[ev.id]||[]).filter(r=>r.status==="going"||r.status==="waitlist").sort((a,b)=>{const ao=a.status==="going"?0:1,bo=b.status==="going"?0:1;return ao-bo||(a.at||0)-(b.at||0)})}
function person(ev,r,detail=false){
  const going=r.status==="going",checked=!!r.checkedIn;
  const name=r.name||String(r.email||"").split("@")[0]||"Unknown";
  const diet=String(r.dietary||"").trim();
  const hasDiet=!!(diet && diet.toLowerCase()!=="anything");
  const dietLabel=hasDiet ? diet : "No dietary requirement";
  const tags=[going?'<span class="tag moss">Reserved</span>':'<span class="tag gold">Waitlist</span>'];
  if(r.guests)tags.push('<span class="tag gold">+'+esc(r.guests)+' guest'+(Number(r.guests)===1?'':'s')+'</span>');
  if(r.slot)tags.push('<span class="tag">'+esc(r.slot)+'</span>');
  if(r.choice)tags.push('<span class="tag">'+esc(r.choice)+'</span>');
  const detailBits=[r.email||"",r.programme||""].filter(Boolean).join(" · ");
  return '<div class="person '+(checked?'checked':'')+'" data-person-email="'+esc(r.email||"")+'">'+
    '<div class="av">'+esc(initials(name))+'</div>'+ 
    '<div class="personMain"><b>'+esc(name)+'</b>'+
      (detailBits?'<small>'+esc(detailBits)+'</small>':'')+
      '<div class="'+(hasDiet?'dietary need':'dietary')+'"><span class="dk">Dietary</span><span>'+esc(dietLabel)+'</span></div>'+ 
      '<div class="tags">'+tags.join("")+'</div>'+ (r.note?'<small style="margin-top:5px">'+esc(r.note)+'</small>':'')+
    '</div>'+ 
    (going?'<label class="checkwrap '+(checked?'ischecked':'')+'"><input class="doorcheck" type="checkbox" data-check data-event="'+esc(ev.id)+'" data-email="'+esc(r.email)+'" '+(checked?'checked':'')+' aria-label="'+(checked?'Remove check-in':'Check in')+'"><span class="checkui"><svg viewBox="0 0 24 24"><path d="M5 12l4 4L19 7"/></svg></span></label>':'<span class="wait">Waiting</span>')+
  '</div>';
}
const openEvents=new Set(),detailState={};
function eventCard(ev){
  const rs=reservations(ev),going=rs.filter(r=>r.status==="going").length,wait=rs.filter(r=>r.status==="waitlist").length;
  const hasNeed=rs.filter(r=>r.status==='going'&&String(r.dietary||'').trim()&&String(r.dietary||'').trim().toLowerCase()!=='anything').length;
  const venue=(ev.venue||'').trim(), mark=venue?venue.charAt(0).toUpperCase():'J';
  return '<section class="event" data-event="'+esc(ev.id)+'"><button class="eventHead" data-event-open="'+esc(ev.id)+'">'+
    '<span class="date"><b>'+esc(String(ev.date||'').slice(-2))+'</b><small>'+esc(String(shortDate(ev.date)).split(' ')[0])+'</small></span>'+ 
    '<span class="eventcopy"><b>'+esc(ev.title)+'</b><small>'+esc(ev.start||'')+(venue?' · '+esc(venue):'')+' · '+going+' reserved'+(wait?' · '+wait+' waiting':'')+(hasNeed?' · '+hasNeed+' dietary':'')+'</small></span>'+ 
    '<span class="eventMark"><span class="markWide">'+esc(venue?venue.slice(0,2).toUpperCase():'JC')+'</span><span class="markSmall">'+esc(mark)+'</span></span>'+(going?'<span class="pill">'+going+'</span>':'')+'<span class="chev">›</span></button></section>';
}
function render(){
  if(!S)return;
  const events=(S.events||[]).slice().sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
  let lastDate="",html="";
  for(const ev of events){
    if(ev.date!==lastDate){lastDate=ev.date;html+='<div class="day">'+esc(fullDate(ev.date))+'</div>'}
    html+=eventCard(ev);
  }
  $("events").innerHTML=html||'<div class="card empty"><b>No events</b>The programme is empty.</div>';
  updateStatsOnly();
}

function renderEventList(id){const ev=(S.events||[]).find(x=>x.id===id);if(!ev)return;const rs=reservations(ev),q=(detailState[id]||"").trim().toLowerCase(),shown=q?rs.filter(r=>r.__search.includes(q)):rs;const box=document.querySelector('[data-list="'+CSS.escape(id)+'"]');if(box)box.innerHTML=shown.length?shown.map(r=>person(ev,r,true)).join(""):'<div class="empty"><b>No matches</b>Try another name.</div>';const c=document.querySelector('[data-shown="'+CSS.escape(id)+'"]');if(c)c.textContent=shown.length+' shown'}
function openDetail(id){const ev=(S.events||[]).find(x=>x.id===id);if(!ev)return;const rs=reservations(ev),q=detailState[id]||"";const filtered=rs.filter(r=>!q||[r.name,r.email,r.programme,r.dietary].some(v=>String(v||"").toLowerCase().includes(q.toLowerCase())));$("eventPage").innerHTML='<div class="detail"><div class="hero"><button class="back" data-back><svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>Back</button><img class="heroLogo" src="/favicon.svg" alt=""><div class="heroInner"><div class="when">'+esc(fullDate(ev.date))+' · '+esc(ev.start||"")+'</div><h2>'+esc(ev.title)+'</h2><div class="meta">'+esc(ev.venue||"")+' · '+rs.filter(r=>r.status==="going").length+' reserved'+(rs.filter(r=>r.status==="waitlist").length?' · '+rs.filter(r=>r.status==="waitlist").length+' waiting':'')+'</div></div></div><div class="detailBody"><div class="detailTools"><input class="detailSearch" id="detailSearch" type="search" value="'+esc(q)+'" placeholder="Search this event… name or email" autocomplete="off"><button class="refreshLight" id="detailRefresh">Refresh</button></div><div class="detailHead"><h3>Reservation list</h3><span class="mini">Door copy · '+esc(rs.filter(r=>r.status==="going"&&String(r.dietary||"").trim()&&String(r.dietary||"").trim().toLowerCase()!=="anything").length)+' dietary requirements</span></div><div class="doorHint">Tick the box as each person arrives. The check-in saves in the background.</div><div class="sectionTitle" style="margin-top:-4px"><span id="detailCount">'+filtered.length+' shown</span></div><div class="detailList" id="detailList">'+(filtered.length?filtered.map(r=>person(ev,r,true)).join(""):'<div class="empty"><b>No reservations</b>There is nobody on the list yet.</div>')+'</div></div></div>';$("eventPage").hidden=false;requestAnimationFrame(()=>$("detailSearch").focus());detailState.active=id}
function renderDetailList(){const id=detailState.active,ev=(S.events||[]).find(x=>x.id===id);if(!ev)return;const q=($("detailSearch").value||"").trim().toLowerCase();detailState[id]=q;const rs=reservations(ev);rs.forEach(r=>{if(!r.__search)r.__search=[r.name,r.email,r.programme,r.dietary,r.choice,r.slot].map(v=>String(v||"").toLowerCase()).join(" ")});const shown=q?rs.filter(r=>r.__search.includes(q)):rs;$("detailList").innerHTML=shown.length?shown.map(r=>person(ev,r,true)).join(""):'<div class="empty"><b>No matches</b>Try another name.</div>';$("detailCount").textContent=shown.length+' shown'}
function closeDetail(){$("eventPage").hidden=true;detailState.active=null}
function cacheWrite(){try{sessionStorage.setItem(CACHE,JSON.stringify(S))}catch(e){}}
function cacheRead(){try{const x=JSON.parse(sessionStorage.getItem(CACHE)||"null");return x&&x.events?x:null}catch(e){return null}}
async function refresh(quiet=false){const b=$("refresh");if(!quiet)b.classList.add("busy");try{const s=await api("state");if(!s||!s.me||s.me.role!=="committee")throw new Error("Door Reservations is restricted to committee access.");S=s;cacheWrite();render();if(detailState.active)openDetail(detailState.active);if(!quiet)toast("Updated")}catch(e){if(!quiet)toast(e.message)}finally{if(!quiet)b.classList.remove("busy")}}
function preloadGsi(){if(gsiScript)return gsiScript;const s=document.createElement("script");s.src="https://accounts.google.com/gsi/client";s.async=true;s.defer=true;document.head.appendChild(s);gsiScript=s;return s}
function gsiKept(){try{const x=JSON.parse(localStorage.getItem(GSI_KEY)||"null");return x&&x.ready&&x.clientId?x:null}catch(e){return null}}
function gsiKeep(x){try{if(x&&x.ready&&x.clientId)localStorage.setItem(GSI_KEY,JSON.stringify(x))}catch(e){}}
async function startGsi(cfg){if(gsiUp)return;gsiUp=true;if(!cfg||!cfg.ready){$("gateMsg").textContent="Google sign-in is not configured.";return}window.handleGsi=async res=>{$("gateMsg").textContent="Checking access…";try{const r=await api("googleToken",{credential:res.credential});if(r&&r.bookDown)throw new Error("The MCR register is temporarily unavailable.");if(r&&r.needsBook)throw new Error("Your account is not authorised for this application.");setToken(r.token);const state=r.state&&r.state.me?r.state:await api("state");if(!state||!state.me||state.me.role!=="committee")throw new Error("Door Reservations is restricted to committee access.");S=state;cacheWrite();$("gate").hidden=true;$("main").hidden=false;render();startPolling()}catch(e){clearToken();$("gateMsg").textContent=e.message}};const draw=()=>{if(!window.google||!window.google.accounts||!window.google.accounts.id){setTimeout(draw,200);return}window.google.accounts.id.initialize({client_id:cfg.clientId,callback:window.handleGsi,hd:cfg.hd||undefined,ux_mode:"popup",auto_select:false});$("gsiBtn").innerHTML="";window.google.accounts.id.renderButton($("gsiBtn"),{theme:"filled_blue",size:"large",shape:"pill",width:280,text:"signin_with",logo_alignment:"center"})};const sc=preloadGsi();if(window.google&&window.google.accounts&&window.google.accounts.id)draw();else sc.addEventListener("load",draw)}
async function openGate(){try{const kept=gsiKept();if(kept)startGsi(kept);const p=await api("ping");gsiKeep(p.signIn);if(!kept)startGsi(p.signIn)}catch(e){$("gateMsg").textContent=e.message}}
function startPolling(){clearInterval(startPolling.t);startPolling.t=setInterval(()=>refresh(true),30000)}
$("refresh").addEventListener("click",()=>refresh(false));
document.addEventListener("click",e=>{const open=e.target.closest("[data-event-open]");if(open){openDetail(open.dataset.eventOpen);return}const back=e.target.closest("[data-back]");if(back){closeDetail();return}});
const checkQueue=new Map();
function paintCheck(evId,email,on){const r=((S.rsvps||{})[evId]||[]).find(x=>x.email===email);if(r)r.checkedIn=on;document.querySelectorAll('[data-check][data-event="'+CSS.escape(evId)+'"][data-email="'+CSS.escape(email)+'"]').forEach(c=>{c.checked=on;const row=c.closest('.person');if(row)row.classList.toggle('checked',on)});updateStatsOnly()}
async function saveCheck(evId,email,on){const key=evId+'|'+email;checkQueue.set(key,{evId,email,on});await new Promise(r=>setTimeout(r,0));if(!checkQueue.has(key)||checkQueue.get(key).on!==on)return;try{await api('checkIn',{eventId:evId,email,on});checkQueue.delete(key);cacheWrite()}catch(err){if(!checkQueue.has(key)||checkQueue.get(key).on!==on)return;checkQueue.delete(key);paintCheck(evId,email,!on);toast('Check-in could not be saved')}}
document.addEventListener('change',e=>{const check=e.target.closest('[data-check]');if(!check)return;const evId=check.dataset.event,email=check.dataset.email,on=check.checked;paintCheck(evId,email,on);saveCheck(evId,email,on)});
document.addEventListener("input",e=>{if(e.target.id==="detailSearch"){renderDetailList()}});
function updateStatsOnly(){const events=S.events||[],total=events.reduce((n,e)=>n+reservations(e).filter(r=>r.status==="going").length,0),ci=events.reduce((n,e)=>n+reservations(e).filter(r=>r.status==="going"&&r.checkedIn).length,0);$("stats").innerHTML='<div class="stat"><b>'+events.length+'</b><span>events</span></div><div class="stat"><b>'+total+'</b><span>reserved</span></div><div class="stat"><b>'+ci+'</b><span>checked in</span></div>'}
$("eventPage").addEventListener("click",e=>{if(e.target.id==="detailRefresh")refresh(false)});
(function boot(){token=getToken();if(token){const cached=cacheRead();if(cached&&cached.me&&cached.me.role==="committee"){S=cached;$("gate").hidden=true;$("main").hidden=false;render();startPolling();refresh(true)}else refresh(true).catch(()=>{})}else openGate()})();
</script>
